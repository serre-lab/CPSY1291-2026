<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adversarial attack: a tiny change to every pixel flips the network's answer</title>
<style>
:root{--bg:#FAF9F5;--ink:#1E293B;--body:#334155;--muted:#64748B;--mag:#B5396B;--green:#3F7A6B;--gold:#F2C14E;--blue:#3E6D8E;--pop:#B23A2E;--track:#E7E3DA}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-size:18px}
main{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 18px;max-width:1680px;margin:0 auto}
.controls{display:flex;flex-wrap:wrap;gap:8px 26px;align-items:center;justify-content:center;min-height:44px;width:100%}
.controls .grp{display:flex;gap:8px;align-items:center;white-space:nowrap}
.grp .lab{color:var(--muted)}
button{font:inherit;font-size:18px;padding:5px 12px;border:1px solid #c9c2b7;border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
button.thumb{padding:2px;line-height:0;border-width:3px;border-color:transparent;background:none}
button.thumb[aria-pressed=true]{border-color:var(--blue);background:none}
button.thumb img{width:44px;height:44px;border-radius:4px;display:block}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.slider{display:flex;flex-direction:column;gap:0;min-width:420px}
.slider .top{display:flex;gap:10px;align-items:baseline;white-space:nowrap}
.slider .top b{font-variant-numeric:tabular-nums;min-width:74px;display:inline-block;color:var(--mag)}
input[type=range]{width:100%;accent-color:var(--mag);margin:4px 0 0}
.ticks{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:14px}
.panel{display:flex;flex-direction:column;gap:6px;align-items:center}
.panel h2{font-size:19px;font-weight:500;margin:0;color:var(--body);white-space:nowrap;height:26px}
.panel h2 small{font-size:16px;color:var(--muted);font-weight:400}
.op{font-size:40px;color:var(--muted);padding-top:30px;width:28px;text-align:center}
canvas{display:block;width:340px;height:340px;border:1px solid #d9d4cc;background:#fff;image-rendering:auto}
.bars{display:grid;grid-template-columns:250px 760px 70px;gap:4px 14px;align-items:center;margin-top:2px}
.bars .hd{grid-column:1/-1;white-space:nowrap;font-size:17px;color:var(--muted);margin-bottom:2px}
.bars .hd i{font-style:normal;padding:0 6px;border-radius:3px;color:#fff}
.bars .nm{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.bars .tr{position:relative;height:20px;background:var(--track);border-radius:4px;overflow:hidden}
.bars .fl{position:absolute;left:0;top:0;bottom:0;background:var(--blue);transition:width .15s ease}
.bars .v{font-size:19px;font-variant-numeric:tabular-nums;text-align:right}
.bars .orig .fl{background:var(--green)}.bars .orig .nm{color:var(--green);font-weight:600}
.bars .new .fl{background:var(--pop)}.bars .new .nm{color:var(--pop);font-weight:600}
.foot{display:flex;justify-content:space-between;gap:24px;width:100%;max-width:1220px;font-size:16px;color:var(--muted)}
@media (max-width:1300px){canvas{width:min(340px,28vw);height:min(340px,28vw)}.op{width:14px;font-size:28px}.panel h2{white-space:normal;height:auto;text-align:center;max-width:28vw;font-size:16px}.panel h2 small{display:block;font-size:13px}.bars{grid-template-columns:minmax(110px,180px) minmax(150px,55vw) 60px}.bars .hd{white-space:normal}.slider{min-width:0;width:min(560px,90vw)}.foot{flex-direction:column;gap:2px}.foot p{white-space:normal}}
.foot p{margin:0;white-space:nowrap}#status{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
html[data-embed] .foot{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
<script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.dataset.embed='1';</script>
<script src="adversarial_data.js"></script>
</head><body><main>
<div class="controls">
 <div class="grp" role="group" aria-label="photograph"><span class="lab">photo</span><span id="pics"></span></div>
 <div class="grp" role="group" aria-label="network"><span class="lab">network</span><span id="nets"></span></div>
 <div class="slider"><div class="top"><label for="eps">attack size: how much each pixel's value may change (out of 255)</label><b id="epsv">0</b></div>
  <input id="eps" type="range" min="0" step="1" value="0" aria-describedby="epsv"><div class="ticks" id="ticks" aria-hidden="true"></div></div>
</div>
<div class="row">
 <div class="panel"><h2>original photograph</h2><canvas id="c0" width="340" height="340" role="img"></canvas></div>
 <div class="op" aria-hidden="true">+</div>
 <div class="panel"><h2>the change, made visible <small id="amp"></small></h2><canvas id="c1" width="340" height="340" role="img"></canvas></div>
 <div class="op" aria-hidden="true">=</div>
 <div class="panel"><h2>attacked image <small id="linf"></small></h2><canvas id="c2" width="340" height="340" role="img"></canvas></div>
</div>
<div class="bars" id="bars"></div>
<div class="foot"><p id="status" role="status" aria-live="polite"></p><p>Precomputed: 10 gradient steps per size (PGD, L∞).</p></div>
</main>
<script>
(function(){
const $=id=>document.getElementById(id), D=window.ADV, q=new URLSearchParams(location.search), DPR=Math.min(2,devicePixelRatio||1);
const NETS=Object.keys(D.networks), E=D.eps255, C=D.classes;
let im=+(q.get('img')||0), net=q.get('net')==='robust'?'robust':'standard', ei=Math.max(0,E.indexOf(+(q.get('eps')||0)));
const cache={};const load=src=>cache[src]||(cache[src]=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src='data:image/jpeg;base64,'+src;}));
const cv=[0,1,2].map(k=>{const c=$('c'+k);c.width=c.height=340*DPR;return c;});
const fmt=e=>(e%1?e.toFixed(1):String(e));
// controls
D.images.forEach((m,i)=>{const b=document.createElement('button');b.className='thumb';b.type='button';b.setAttribute('aria-label',`photograph ${i+1}: ${C[m.true]}`);b.title=C[m.true];b.innerHTML=`<img alt="" src="data:image/jpeg;base64,${m.photo}">`;b.onclick=()=>{im=i;render();};$('pics').appendChild(b);});
NETS.forEach(n=>{const b=document.createElement('button');b.type='button';b.textContent=n==='standard'?'standard':'robust (adversarially trained)';b.dataset.n=n;b.onclick=()=>{net=n;render();};$('nets').appendChild(b);});
const sl=$('eps');sl.max=E.length-1;sl.value=ei;sl.oninput=()=>{ei=+sl.value;render();};
$('ticks').innerHTML=E.map(e=>`<span>${fmt(e)}</span>`).join('');
async function draw(k,src){const i=await load(src);const g=cv[k].getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);g.imageSmoothingEnabled=true;g.drawImage(i,0,0,340,340);}
let tok=0;
function render(){
 const m=D.images[im],R=m.runs[net],r=R.eps[ei],e=E[ei],att=R.attacked,t1=r.top[0];
 document.querySelectorAll('#pics button').forEach((b,i)=>b.setAttribute('aria-pressed',i===im));
 document.querySelectorAll('#nets button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.n===net));
 sl.value=ei;$('epsv').textContent=fmt(e)+' / 255';sl.setAttribute('aria-valuetext',`${fmt(e)} out of 255`);
 $('amp').textContent=e?`(amplified ×${Math.round(255/(2*e))}; grey = no change)`:'(nothing changed)';
 $('linf').textContent=e?`(largest change ${fmt(r.linf255)}/255)`:'';
 const my=++tok;Promise.all([load(m.photo),load(r.delta),load(r.adv)]).then(()=>{if(my!==tok)return;draw(0,m.photo);draw(1,r.delta);draw(2,r.adv);});
 // bars: top 5, attacked class always shown
 let idx=r.top.slice(0,5),pp=r.p.slice(0,5);
 if(!idx.includes(att)){idx[4]=att;pp[4]=r.p_att;}
 const flipped=t1!==att;
 let h=`<div class="hd">top-5 probabilities for the attacked image: <i style="background:var(--green)">green</i> = answer on the original (${C[att]})${flipped?`; <i style="background:var(--pop)">red</i> = new answer`:''}${m.true!==att?` · true label: ${C[m.true]}`:``}</div>`;
 idx.forEach((c,j)=>{const cls=c===att?'orig':(flipped&&c===t1?'new':'');h+=`<div class="nm ${cls}" style="display:contents"><span class="nm">${C[c]}</span></div><div class="${cls}" style="display:contents"><div class="tr"><div class="fl" style="width:${(100*pp[j]).toFixed(1)}%"></div></div><span class="v">${pp[j].toFixed(3)}</span></div>`;});
 $('bars').innerHTML=h;
 const desc=`${C[m.true]} photograph, ${D.networks[net]}, attack size ${fmt(e)} of 255: top class ${C[t1]} p ${r.p[0].toFixed(3)}; p(${C[att]}) ${r.p_att.toFixed(3)}`;
 $('status').textContent=desc+(flipped?' (answer changed)':'');
 cv[0].setAttribute('aria-label',`original photograph of a ${C[m.true]}`);
 cv[1].setAttribute('aria-label',e?`perturbation amplified ${Math.round(255/(2*e))} times: fine coloured noise over the whole image`:'no perturbation: flat grey');
 cv[2].setAttribute('aria-label',`attacked image, visually the same as the original; network says ${C[t1]}`);
}
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape'&&window.parent!==window){window.parent.postMessage({type:'cpsy-exit-interactive'},'*');try{window.parent.focus();}catch(_){}return;}
 if(ev.target&&ev.target.tagName==='INPUT')return;
 if(ev.key==='ArrowRight'||ev.key==='ArrowUp'){ev.preventDefault();ei=Math.min(E.length-1,ei+1);render();}
 else if(ev.key==='ArrowLeft'||ev.key==='ArrowDown'){ev.preventDefault();ei=Math.max(0,ei-1);render();}
 else if(ev.key>='1'&&ev.key<=String(D.images.length)){im=+ev.key-1;render();}
 else if(ev.key==='n'||ev.key==='N'){net=net==='standard'?'robust':'standard';render();}
});
render();
window.__demo={get state(){const r=D.images[im].runs[net].eps[ei];return{im,net,eps:E[ei],top:r.top.map(c=>C[c]),p:r.p}},set:(i,n,e)=>{im=i;net=n;ei=E.indexOf(e);render();}};
})();
</script></body></html>
