<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A convolutional layer: four filters, four feature maps</title>
<style>
:root{--bg:#FAF9F5;--ink:#1E293B;--muted:#64748B;--gold:#F2C14E}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif}
main{display:grid;grid-template-columns:420px 150px 440px;gap:36px;align-items:start;justify-content:center;padding:10px 18px}
.controls{grid-column:1/-1;order:-1;display:flex;gap:14px 22px;align-items:center;justify-content:center;font-size:16px}
.panel{display:flex;flex-direction:column;align-items:center;gap:8px}
.panel h2{font-size:18px;font-weight:500;margin:0;color:var(--muted);white-space:nowrap;height:24px}
canvas{image-rendering:pixelated;background:#fff;border:1px solid #d9d4cc}
.filters{display:flex;flex-direction:column;gap:10px}
.maps{display:grid;grid-template-columns:210px 210px;gap:12px}
button{font:inherit;padding:6px 14px;border:1px solid #c9c2b7;border-radius:8px;background:#fff;cursor:pointer}
button.primary{background:var(--gold);border-color:var(--gold);font-size:18px;padding:8px 22px}
.stat{font-size:16px;color:var(--muted);white-space:nowrap}.stat b{color:var(--ink);font-variant-numeric:tabular-nums;display:inline-block;min-width:64px}
</style>
<script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.dataset.embed='1';</script>
<script src="convolution_data.js"></script></head><body><main>
<div class="controls"><button id="step" type="button">step</button><button id="run" class="primary" type="button">▶ slide the filters</button><button id="all" type="button">finish</button><button id="reset" type="button">reset</button><span class="stat">position <b id="pos">0, 0</b> of 90 × 90</span></div>
<div class="panel"><h2>image, window in magenta</h2><canvas id="img" width="96" height="96" style="width:420px;height:420px"></canvas></div>
<div class="panel"><h2>4 filters (7 × 7)</h2><div class="filters" id="flts"></div></div>
<div class="panel"><h2>4 feature maps, one per filter</h2><div class="maps" id="maps"></div></div>
</main><script>
const $=id=>document.getElementById(id), IMG=window.CONV_IMAGE, N=IMG.length, K=7, M=N-K+1;
function zm(f){let s=0;for(const r of f)for(const v of r)s+=v;const m=s/(K*K);let n=0;for(const r of f)for(const v of r)n+=(v-m)**2;n=Math.sqrt(n);return f.map(r=>r.map(v=>(v-m)/n));}
function gabor(t){const o=[];for(let y=0;y<K;y++){const r=[];for(let x=0;x<K;x++){const u=x-3,v=y-3,a=u*Math.cos(t)+v*Math.sin(t),b=-u*Math.sin(t)+v*Math.cos(t);r.push(Math.exp(-(a*a+0.6*b*b)/(2*1.6*1.6))*Math.cos(2*Math.PI*a/4));}o.push(r);}return zm(o);}
const F=[0,Math.PI/4,Math.PI/2,3*Math.PI/4].map(gabor);
const OUT=F.map(()=>new Float32Array(M*M)), MAX=[1,1,1,1]; let pos=0, timer=null;
function resp(W,i,j){let m=0;for(let y=0;y<K;y++)for(let x=0;x<K;x++)m+=IMG[i+y][j+x];m/=K*K;let s=0;for(let y=0;y<K;y++)for(let x=0;x<K;x++)s+=W[y][x]*(IMG[i+y][j+x]-m);return s;}
F.forEach((W,f)=>{let mx=1e-6;for(let i=0;i<M;i++)for(let j=0;j<M;j++)mx=Math.max(mx,resp(W,i,j));MAX[f]=mx;});
const fc=[],mc=[];
F.forEach((W,f)=>{const c=document.createElement('canvas');c.width=K;c.height=K;c.style.cssText='width:96px;height:96px';$('flts').appendChild(c);fc.push(c);
 const d=c.getContext('2d').createImageData(K,K);let mx=0;W.forEach(r=>r.forEach(v=>mx=Math.max(mx,Math.abs(v))));for(let y=0;y<K;y++)for(let x=0;x<K;x++){const v=W[y][x]/mx,q=4*(y*K+x);if(v>=0){d.data[q]=181;d.data[q+1]=57;d.data[q+2]=107;d.data[q+3]=255*v;}else{d.data[q]=62;d.data[q+1]=109;d.data[q+2]=142;d.data[q+3]=-255*v;}}c.getContext('2d').putImageData(d,0,0);
 const m=document.createElement('canvas');m.width=M;m.height=M;m.style.cssText='width:210px;height:210px';$('maps').appendChild(m);mc.push(m);});
function draw(){const g=$('img').getContext('2d'),d=g.createImageData(N,N);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=Math.round(IMG[y][x]*255),q=4*(y*N+x);d.data[q]=d.data[q+1]=d.data[q+2]=v;d.data[q+3]=255;}g.putImageData(d,0,0);const i=Math.floor(pos/M),j=pos%M;g.strokeStyle='#B5396B';g.strokeRect(j+0.5,i+0.5,K-1,K-1);
 mc.forEach((c,f)=>{const h=c.getContext('2d'),e=h.createImageData(M,M);for(let k=0;k<M*M;k++){const q=4*k;if(k>=pos){e.data[q]=240;e.data[q+1]=238;e.data[q+2]=233;}else{const v=Math.round(255*Math.max(0,OUT[f][k])/MAX[f]);e.data[q]=e.data[q+1]=e.data[q+2]=v;}e.data[q+3]=255;}h.putImageData(e,0,0);});
 $('pos').textContent=`${i}, ${j}`;}
function step(){if(pos>=M*M)return false;const i=Math.floor(pos/M),j=pos%M;F.forEach((W,f)=>OUT[f][pos]=resp(W,i,j));pos++;return pos<M*M;}
function stop(){if(timer){clearInterval(timer);timer=null;$('run').textContent='▶ slide the filters';}}
$('step').onclick=()=>{stop();step();draw();};
$('run').onclick=()=>{if(timer){stop();return;}$('run').textContent='pause';timer=setInterval(()=>{for(let k=0;k<24;k++)if(!step()){stop();break;}draw();},30);};
$("all").onclick=()=>{stop();while(step());pos=M*M;draw();$("pos").textContent="89, 89";};
$('reset').onclick=()=>{stop();pos=0;draw();};
draw();
</script></body></html>
