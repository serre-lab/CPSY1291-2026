<title>A map of mental space — CPSY 1291</title>
<style>
  :root{ --sienna:#9C5A2E; --slate:#3E6D8E; --teal:#3F7A6B;
         --cream:#FAF9F5; --ink:#1E293B; --muted:#5B6B7A; --rule:#E7E3DA; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);
    font-family:"Helvetica Neue",Arial,system-ui,sans-serif;overflow:hidden}
  #wrap{height:100%;display:flex;flex-direction:column}
  #stage{position:relative;flex:1;overflow:hidden;cursor:grab}
  #stage.drag{cursor:grabbing}
  svg{position:absolute;inset:0;width:100%;height:100%}
  .dot{transition:opacity .25s}
  .thumb{transition:opacity .25s}
  #tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
    background:var(--ink);color:var(--cream);font-size:13px;font-weight:600;
    padding:5px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-140%)}
  #bar{display:flex;align-items:center;gap:14px;padding:9px 14px;border-top:1px solid var(--rule);
    font-size:13px;color:var(--muted);flex-wrap:wrap}
  .key{display:flex;align-items:center;gap:5px;font-weight:700;color:var(--ink);cursor:pointer;
    opacity:.45;transition:opacity .15s}
  .key.on{opacity:1}
  .key i{width:12px;height:12px;border-radius:3px;display:inline-block}
  button{font:inherit;font-weight:700;padding:4px 12px;border-radius:8px;border:2px solid var(--slate);
    background:#fff;color:var(--slate);cursor:pointer}
  .hint kbd{font-family:inherit;font-weight:700;background:#fff;border:1px solid var(--rule);
    border-radius:5px;padding:1px 6px;color:var(--ink)}
</style>
</head>

    <div id="tip"></div>
  </div>
  <div id="bar">
    <button id="reset">Reset</button>
    <div id="legend" style="display:flex;gap:12px;flex-wrap:wrap"></div>
    <span class="hint" style="margin-left:auto"><kbd>scroll</kbd> zoom · <kbd>drag</kbd> pan · zoom in to see the photographs</span>

const ATLAS='../images/2026-09-10/a1_mds_atlas.jpg', CELL=128, COLS=12;
const COLOR={'Amphibian':'#3E6D8E','Bird':'#C2691C','Carnivore':'#3F7A6B','Hoofed mammal':'#B5396B',
             'Other mammal':'#7A5AA8','Primate':'#8A5A3C','Reptile':'#D08AB0','Rodent':'#7B8794'};
const svg=document.getElementById('map'), stage=document.getElementById('stage'), tip=document.getElementById('tip');
const NS='http://www.w3.org/2000/svg';
const mk=(n,a={})=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};

// one <defs> pattern per image, cropped out of the sprite atlas
const defs=mk('defs'); svg.appendChild(defs);
const gThumb=mk('g'), gDot=mk('g'); svg.appendChild(gThumb); svg.appendChild(gDot);
const off=new Set();  // taxa toggled off

let W=0,H=0,scale=1,tx=0,ty=0,inited=false;
function layout(){ const r=stage.getBoundingClientRect(); W=r.width; H=r.height;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  if(!inited){ tx=W/2; ty=H/2; inited=true; }
  draw(); }
const pad=()=>Math.min(W,H)*0.06;
function toScreen(p){ const s=Math.min(W,H)/2-pad();
  return [p.x*s*scale+tx, p.y*s*scale+ty]; }

const nodes=PTS.map((p,k)=>{
  const col=COLOR[p.g]||'#7B8794';
  const pat=mk('pattern',{id:'im'+k,patternUnits:'objectBoundingBox',width:1,height:1});
  const im=mk('image',{href:ATLAS,x:-(k%COLS)*CELL,y:-Math.floor(k/COLS)*CELL,
    width:COLS*CELL,height:Math.ceil(PTS.length/COLS)*CELL,preserveAspectRatio:'none'});
  pat.appendChild(im); defs.appendChild(pat);
  const rect=mk('rect',{class:'thumb',fill:'url(#im'+k+')',rx:3,opacity:0});
  const dot=mk('circle',{class:'dot',fill:col,r:7,stroke:'var(--cream)','stroke-width':1.5});
  gThumb.appendChild(rect); gDot.appendChild(dot);
  const show=e=>{ tip.textContent=p.l+' · '+p.g; const [x,y]=toScreen(p);
    tip.style.left=x+'px'; tip.style.top=y+'px'; tip.style.opacity=1; };
  [rect,dot].forEach(el=>{ el.addEventListener('pointerenter',show);
    el.addEventListener('pointerleave',()=>tip.style.opacity=0); el.style.cursor='pointer'; });
  return {p,rect,dot,col};
});

function draw(){
  // photographs fade in as you zoom past 1.6x, which is the point of the widget
  const t=Math.max(0,Math.min(1,(scale-1.5)/1.1));
  const size=Math.max(26,Math.min(120,34*scale));
  nodes.forEach(n=>{
    const hidden=off.has(n.p.g);
    const [x,y]=toScreen(n.p);
    n.dot.setAttribute('cx',x); n.dot.setAttribute('cy',y);
    n.dot.setAttribute('r', 7*Math.min(1.6,Math.max(.8,scale*.6)));
    n.dot.setAttribute('opacity', hidden?0.05:(1-t));
    n.rect.setAttribute('x',x-size/2); n.rect.setAttribute('y',y-size/2);
    n.rect.setAttribute('width',size); n.rect.setAttribute('height',size);
    n.rect.setAttribute('opacity', hidden?0:t);
    n.rect.style.pointerEvents = t>0.5?'auto':'none';
    n.dot.style.pointerEvents  = t>0.5?'none':'auto';
  });
}

stage.addEventListener('wheel',e=>{ e.preventDefault();
  const r=stage.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const f=e.deltaY>0?1/1.13:1.13, ns=Math.max(1,Math.min(9,scale*f));
  tx=mx-(mx-tx)*(ns/scale); ty=my-(my-ty)*(ns/scale); scale=ns; draw();
},{passive:false});
let drag=null;
stage.addEventListener('pointerdown',e=>{drag={x:e.clientX-tx,y:e.clientY-ty};stage.classList.add('drag');stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{ if(!drag)return; tx=e.clientX-drag.x; ty=e.clientY-drag.y; draw(); });
addEventListener('pointerup',()=>{drag=null;stage.classList.remove('drag');});
document.getElementById('reset').onclick=()=>{scale=1;tx=W/2;ty=H/2;draw();};

const legend=document.getElementById('legend');
Object.keys(COLOR).forEach(g=>{
  const b=document.createElement('span'); b.className='key on';
  b.innerHTML='<i style="background:'+COLOR[g]+'"></i>'+g;
  b.onclick=()=>{ off.has(g)?off.delete(g):off.add(g); b.classList.toggle('on',!off.has(g)); draw(); };
  legend.appendChild(b);
});
addEventListener('resize',layout); layout();
</script>
