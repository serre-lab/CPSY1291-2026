<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Network Explorer · ResNet18</title>
  <style>
    :root {
      --paper: #FAF9F5;
      --body: #334155;
      --heading: #1e293b;
      --blue: #3E6D8E;
      --green: #3F7A6B;
      --gray: #64748b;
      --cream: #FAF9F5;
      --focus: #3E6D8E;
      --border: #cbd5e1;
      --gap: 8px;
      --fs: 22px;
      --fs-sm: 18px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--body);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: var(--fs);
      line-height: 1.25;
      overflow-x: visible;
    }

    body.embed {
      min-height: 610px;
      overflow: auto;
    }

    .wrap {
      max-width: 1680px;
      margin: 0 auto;
      padding: 10px 12px;
    }

    body.embed .wrap {
      min-height: 610px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    h1 {
      margin: 0 0 4px;
      color: var(--heading);
      font-size: 1.15em;
      font-weight: 700;
    }

    .provenance {
      color: var(--gray);
      font-size: 0.82em;
      margin: 0 0 8px;
    }

    body.embed .standalone-only { display: none !important; }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    button, select, input {
      font: inherit;
      color: inherit;
    }

    button {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      color: var(--heading);
    }

    button:hover { border-color: var(--blue); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button[aria-pressed="true"] {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      flex-shrink: 0;
    }

    .toolbar label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--heading);
      font-weight: 600;
      font-size: 0.95em;
    }

    .toolbar select {
      min-width: 12em;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--paper);
    }

    .stage-group {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .stage-meta {
      color: var(--gray);
      font-size: 0.82em;
      margin: 0;
      flex-shrink: 0;
    }

    .stage-meta strong { color: var(--heading); font-weight: 600; }

    .main {
      display: grid;
      grid-template-columns: minmax(140px, 200px) minmax(0, 1fr) minmax(220px, 280px);
      gap: 10px;
      align-items: start;
      flex: 1;
      min-height: 0;
    }

    body.embed .main {
      gap: 8px;
    }

    .panel {
      min-width: 0;
    }

    .panel-title {
      margin: 0 0 4px;
      font-size: 0.82em;
      font-weight: 650;
      color: var(--heading);
    }

    .input-img {
      display: block;
      width: 100%;
      max-width: 180px;
      height: auto;
      background: var(--paper);
      border: 1px solid var(--border);
    }

    .preds {
      margin: 6px 0 0;
      padding: 0;
      list-style: none;
      font-size: 0.78em;
      color: var(--gray);
    }

    .preds li {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding: 2px 0;
    }

    .preds .lab { color: var(--body); }
    .preds-caption {
      margin: 6px 0 0;
      font-size: 0.72em;
      color: var(--gray);
    }

    .scale-note {
      margin: 4px 0 6px;
      font-size: 0.72em;
      color: var(--gray);
      line-height: 1.3;
    }

    .gallery-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 0.82em;
    }

    .gallery-nav span { color: var(--gray); }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .ch-tile {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 2px;
      padding: 3px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      min-width: 0;
    }

    .ch-tile[aria-pressed="true"] {
      border-color: var(--green);
      box-shadow: inset 0 0 0 2px var(--green);
      background: var(--paper);
      color: inherit;
    }

    .ch-tile .ch-label {
      font-size: 0.72em;
      font-weight: 650;
      color: var(--heading);
      text-align: center;
    }

    .ch-tile canvas {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      image-rendering: pixelated;
      background: var(--cream);
    }

    .detail canvas#detailCanvas {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 1;
      display: block;
      image-rendering: pixelated;
      background: var(--cream);
      border: 1px solid var(--border);
    }

    .controls {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 8px;
      align-items: center;
      margin-top: 6px;
      font-size: 0.82em;
    }

    .controls label { color: var(--heading); font-weight: 600; }

    .controls input[type="number"] {
      width: 100%;
      max-width: 6em;
      padding: 3px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--paper);
    }

    .readout {
      margin-top: 6px;
      font-size: 0.82em;
      color: var(--body);
      min-height: 2.6em;
    }

    .readout strong { color: var(--heading); }

    .mean-line {
      margin-top: 2px;
      font-size: 0.82em;
      color: var(--gray);
    }

    details.map-table {
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    details.map-table summary {
      cursor: pointer;
      font-weight: 650;
      color: var(--heading);
      font-size: 0.95em;
    }

    .map-scroll {
      overflow: auto;
      max-height: 320px;
      margin-top: 8px;
      border: 1px solid var(--border);
      background: var(--paper);
    }

    table.numeric-map {
      border-collapse: collapse;
      font-size: 0.72em;
      font-variant-numeric: tabular-nums;
    }

    table.numeric-map th,
    table.numeric-map td {
      border: 1px solid var(--border);
      padding: 2px 5px;
      text-align: right;
      white-space: nowrap;
    }

    table.numeric-map th {
      background: #f1f5f9;
      color: var(--heading);
      position: sticky;
      top: 0;
    }

    .error {
      margin: 24px 12px;
      padding: 16px;
      border: 2px solid #b91c1c;
      background: #fef2f2;
      color: #7f1d1d;
      max-width: 40em;
    }

    .error h1 { color: #7f1d1d; font-size: 1.1em; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    @media (max-width: 900px) {
      html { font-size: var(--fs-sm); }
      .main {
        grid-template-columns: 1fr;
      }
      body.embed {
        height: auto;
        overflow: auto;
      }
      body.embed .wrap {
        height: auto;
      }
    }

    @media (max-width: 430px) {
      .toolbar label{display:block;width:100%}
      .toolbar select{width:100%;min-width:0;max-width:100%}
      .controls{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
      html { font-size: 18px; }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .wrap { padding: 8px; }
    }
  input[type="range"]{background:transparent}
</style>

<body>
  <div class="wrap" id="app">
    <h1 class="standalone-only" id="pageTitle">Network Explorer</h1>
    <p class="provenance standalone-only" id="provenance"></p>

    <div class="toolbar" role="toolbar" aria-label="Image and layer selection">
      <label for="imageSelect">Image
        <select id="imageSelect"></select>
      </label>
      <button type="button" id="prevStage" aria-label="Previous layer">Previous layer</button>
      <div class="stage-group" role="group" aria-label="Network stages" id="stageButtons"></div>
      <button type="button" id="nextStage" aria-label="Next layer">Next layer</button>

    </div>

    <div class="stage-summary"><p class="stage-meta" id="stageMeta"></p><button type="button" id="vectorMode" aria-pressed="false">Maps → vector</button></div>

    <div class="main">
      <section class="panel" aria-labelledby="inputTitle">
        <h2 class="panel-title" id="inputTitle">Model input crop</h2>
        <img id="inputImg" class="input-img" alt="Model input crop after preprocessing" width="180" height="180" />
        <p class="preds-caption" id="predsCaption" hidden>Classifier output (top 3)</p>
        <ul class="preds" id="preds" aria-label="Top classifier predictions" hidden></ul>
      </section>

      <section class="panel" id="channelPanel" aria-labelledby="galleryTitle">
        <h2 class="panel-title" id="galleryTitle">Channel gallery</h2>
        <p class="scale-note" id="scaleNote"></p>
        <div class="gallery-nav">
          <button type="button" id="prevPage" aria-label="Previous channel page">Previous page</button>
          <span id="pageLabel"></span>
          <button type="button" id="nextPage" aria-label="Next channel page">Next page</button>
          <button type="button" id="strongestChannel">Strongest mean</button>
        </div>
        <div class="gallery" id="gallery" role="group" aria-label="Select a channel"></div>
      </section>

      <section class="panel" id="vectorPanel" aria-labelledby="vectorTitle">
        <h2 class="panel-title" id="vectorTitle">An ordered vector of activations</h2>
        <div class="vector-actions" role="group" aria-label="Vectorization scope"><button type="button" id="oneChannel" aria-pressed="true">One channel</button><button type="button" id="allChannels" aria-pressed="false">All channels</button></div>
        <div class="vector-card">
          <p class="vector-title" id="vectorShape"></p>
          <div class="vector-flow"><canvas id="unrollMap" role="img" aria-label="Selected channel before vectorization"></canvas><div><p>Read each row in order →</p><p class="vector-numbers" id="vectorValues"></p></div></div>
          <div id="channelBlocks" class="channel-blocks" hidden><span>Channel 1</span><span>Channel 2 · …</span><span id="lastChannel"></span></div>
        </div>
        <p id="vectorIndex" aria-live="polite"></p>
        <p class="vector-note" id="vectorDimension"></p>
        <p class="vector-note" id="poolNote"></p>
      </section>
      <section class="panel detail" aria-labelledby="detailTitle">
        <h2 class="panel-title" id="detailTitle">Selected channel</h2>
        <canvas id="detailCanvas" style="cursor:crosshair" role="img" aria-describedby="detailAlt" width="128" height="128"
          aria-label="Enlarged activation map for the selected channel"></canvas>
        <p class="sr-only" id="detailAlt"></p>
        <div class="controls">
          <label for="channelInput">Channel (1–C)</label>
          <input type="number" id="channelInput" min="1" step="1" />
          <label for="rowInput">Row</label>
          <input type="number" id="rowInput" min="0" step="1" />
          <label for="colInput">Column</label>
          <input type="number" id="colInput" min="0" step="1" />
        </div>
        <div class="readout" id="readout" aria-live="polite"></div>
        <p class="mean-line" id="channelMean"></p>
      </section>
    </div>

    <details class="map-table standalone-only" id="mapTableDetails">
      <summary>Numeric activation map (selected channel)</summary>
      <div class="map-scroll" tabindex="0" role="region" aria-label="Activation values, scrollable table">
        <table class="numeric-map" id="numericMap" aria-label="Numeric activation values"></table>
      </div>
    </details>
  </div>

  <script src="network_data.js"></script>
  <script>
(function () {
  'use strict';

  var PAGE_SIZE = 8;
  var ZERO_RGB = [250, 249, 245]; /* cream/white at 0 */
  var MAX_RGB = [62, 109, 142];   /* #3E6D8E */

  var params = new URLSearchParams(location.search);
  var embed = params.get('embed') === '1';
  if (embed) document.body.classList.add('embed');

  function fail(msg) {
    document.body.innerHTML =
      '<div class="error" role="alert"><h1>Invalid network data</h1><p>' +
      escapeHtml(msg) +
      '</p><p>Expected <code>window.NETWORK_DATA</code> from <code>network_data.js</code>.</p></div>';
    throw new Error(msg);
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function isFiniteNumber(n) {
    return typeof n === 'number' && isFinite(n);
  }

  function validateData(d) {
    if (!d || typeof d !== 'object') fail('NETWORK_DATA is missing or not an object.');
    if (!d.model || typeof d.model !== 'string') fail('Missing model string.');
    if (!Array.isArray(d.stages) || d.stages.length < 1) fail('stages must be a non-empty array.');
    if (!Array.isArray(d.images) || d.images.length < 1) fail('images must be a non-empty array.');

    d.stages.forEach(function (st, i) {
      if (!st.id || !st.label || !Array.isArray(st.shape) || st.shape.length !== 3)
        fail('stages[' + i + '] needs id, label, shape:[C,H,W].');
      st.shape.forEach(function (n) {
        if (!Number.isInteger(n) || n < 1) fail('stages[' + i + '] shape must be positive integers.');
      });
    });

    d.images.forEach(function (im, ii) {
      if (!im.id || !im.label || !im.inputSrc)
        fail('images[' + ii + '] needs id, label, inputSrc.');
      if (!Array.isArray(im.stages) || im.stages.length !== d.stages.length)
        fail('images[' + ii + '] stages length must match stages metadata.');
      im.stages.forEach(function (ms, si) {
        var shape = d.stages[si].shape;
        var need = shape[0] * shape[1] * shape[2];
        if (!ms || typeof ms.values !== 'string' || !isFiniteNumber(ms.max) || ms.max < 0)
          fail('images[' + ii + '].stages[' + si + '] needs values (base64) and max ≥ 0.');
        if (!Array.isArray(ms.pooled) || ms.pooled.length !== shape[0])
          fail('images[' + ii + '].stages[' + si + '] pooled must have length C=' + shape[0] + '.');
        var bytes;
        try {
          bytes = atob(ms.values);
        } catch (e) {
          fail('images[' + ii + '].stages[' + si + '] values is not valid base64.');
        }
        if (bytes.length !== need * 4)
          fail(
            'images[' + ii + '].stages[' + si + '] byte length ' +
              bytes.length +
              ' ≠ C×H×W×4=' +
              need * 4 +
              '.'
          );
      });
    });
  }

  function decodeF32(b64) {
    var bin = atob(b64);
    var buf = new ArrayBuffer(bin.length);
    var view = new Uint8Array(buf);
    for (var i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
    return new Float32Array(buf);
  }

  function lerpColor(t) {
    if (t <= 0) return ZERO_RGB.slice();
    if (t >= 1) return MAX_RGB.slice();
    return [
      Math.round(ZERO_RGB[0] + (MAX_RGB[0] - ZERO_RGB[0]) * t),
      Math.round(ZERO_RGB[1] + (MAX_RGB[1] - ZERO_RGB[1]) * t),
      Math.round(ZERO_RGB[2] + (MAX_RGB[2] - ZERO_RGB[2]) * t)
    ];
  }

  /* Shared max for selected image+layer: map value / sharedMax → color. Zero stays cream. */
  function paintMap(canvas, floats, C, H, W, channelIndex, sharedMax) {
    var ctx = canvas.getContext('2d');
    canvas.width = W;
    canvas.height = H;
    var img = ctx.createImageData(W, H);
    var data = img.data;
    var base = channelIndex * H * W;
    var denom = sharedMax > 0 ? sharedMax : 1;
    for (var y = 0; y < H; y++) {
      for (var x = 0; x < W; x++) {
        var v = floats[base + y * W + x];
        var t = v <= 0 ? 0 : Math.min(1, v / denom);
        var rgb = lerpColor(t);
        var i = (y * W + x) * 4;
        data[i] = rgb[0];
        data[i + 1] = rgb[1];
        data[i + 2] = rgb[2];
        data[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  var DATA = window.NETWORK_DATA;
  validateData(DATA);

  var state = {
    imageIndex: 0,
    stageIndex: 0,
    channel: 0, /* 0-based */
    page: 0,
    vectorAll: false,
    row: 0,
    col: 0,
    cache: {}
  };

  function cacheKey(ii, si) {
    return ii + ':' + si;
  }

  function getMaps() {
    var key = cacheKey(state.imageIndex, state.stageIndex);
    if (!state.cache[key]) {
      var ms = DATA.images[state.imageIndex].stages[state.stageIndex];
      var floats = decodeF32(ms.values);
      // colour scale: 99th percentile of the stage, not its maximum, so a few extreme
      // activations do not wash out every other map
      var sample = [];
      for (var q = 0; q < floats.length; q += Math.max(1, Math.floor(floats.length / 20000))) sample.push(floats[q]);
      sample.sort(function (a, b) { return a - b; });
      var p99 = sample[Math.floor(sample.length * 0.99)] || ms.max;
      state.cache[key] = {
        floats: floats,
        max: p99 > 0 ? p99 : ms.max,
        pooled: ms.pooled
      };
    }
    return state.cache[key];
  }

  function shape() {
    return DATA.stages[state.stageIndex].shape;
  }

  function numPages() {
    var C = shape()[0];
    return Math.max(1, Math.ceil(C / PAGE_SIZE));
  }

  function clampState() {
    var sh = shape();
    var C = sh[0],
      H = sh[1],
      W = sh[2];
    if (state.channel < 0) state.channel = 0;
    if (state.channel >= C) state.channel = C - 1;
    state.page = Math.floor(state.channel / PAGE_SIZE);
    if (state.page >= numPages()) state.page = numPages() - 1;
    if (state.row < 0) state.row = 0;
    if (state.row >= H) state.row = H - 1;
    if (state.col < 0) state.col = 0;
    if (state.col >= W) state.col = W - 1;
  }

  var els = {
    imageSelect: document.getElementById('imageSelect'),
    prevStage: document.getElementById('prevStage'),
    nextStage: document.getElementById('nextStage'),
    stageButtons: document.getElementById('stageButtons'),
    stageMeta: document.getElementById('stageMeta'),
    inputImg: document.getElementById('inputImg'),
    preds: document.getElementById('preds'),
    predsCaption: document.getElementById('predsCaption'),
    scaleNote: document.getElementById('scaleNote'),
    prevPage: document.getElementById('prevPage'),
    nextPage: document.getElementById('nextPage'),
    pageLabel: document.getElementById('pageLabel'),
    gallery: document.getElementById('gallery'),
    detailCanvas: document.getElementById('detailCanvas'),
    detailAlt: document.getElementById('detailAlt'),
    channelInput: document.getElementById('channelInput'),
    rowInput: document.getElementById('rowInput'),
    colInput: document.getElementById('colInput'),
    readout: document.getElementById('readout'),
    channelMean: document.getElementById('channelMean'),
    numericMap: document.getElementById('numericMap'),
    pageTitle: document.getElementById('pageTitle'),
    provenance: document.getElementById('provenance')
  };

  function initChrome() {
    els.pageTitle.textContent = 'Network Explorer · ' + DATA.model;
    var fix = DATA.fixture === 'toy' ? ' Synthetic toy fixture (not real network activations).' : '';
    els.provenance.textContent =
      (DATA.preprocessing || '') +
      fix +
      ' Map colors run from light at zero to blue at the maximum for the selected image and layer.';

    DATA.images.forEach(function (im, i) {
      var opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = im.label;
      els.imageSelect.appendChild(opt);
    });

    DATA.stages.forEach(function (st, i) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = st.label;
      btn.setAttribute('aria-pressed', 'false');
      btn.dataset.stageIndex = String(i);
      btn.addEventListener('click', function () {
        state.stageIndex = i;
        state.channel = 0;
        state.row = 0;
        state.col = 0;
        render();
      });
      els.stageButtons.appendChild(btn);
    });
  }

  function activationAt(ch, r, c) {
    var maps = getMaps();
    var sh = shape();
    var H = sh[1],
      W = sh[2];
    return maps.floats[ch * H * W + r * W + c];
  }

  function updateReadout(fromHover, hr, hc) {
    var sh = shape();
    var r = fromHover ? hr : state.row;
    var c = fromHover ? hc : state.col;
    var v = activationAt(state.channel, r, c);
    const maps=getMaps();paintMap(els.detailCanvas,maps.floats,sh[0],sh[1],sh[2],state.channel,maps.max);
    const ctx=els.detailCanvas.getContext('2d');ctx.strokeStyle='#1e293b';ctx.lineWidth=.2;ctx.strokeRect(c+.1,r+.1,.8,.8);
    var prefix = fromHover ? 'Hover' : 'Selected';
    els.readout.innerHTML =
      '<strong>' +
      prefix +
      '</strong> channel ' +
      (state.channel + 1) +
      ' · row ' +
      r +
      ' · col ' +
      c +
      ' → activation <strong>' +
      v.toPrecision(6) +
      '</strong>';
    renderVector(r,c);
  }


  function renderVector(r,c){
    r=r===undefined?state.row:r;c=c===undefined?state.col:c;
    var sh=shape(),C=sh[0],H=sh[1],W=sh[2],n=H*W,maps=getMaps(),offset=state.channel*n;
    var values=Array.from(maps.floats.slice(offset,offset+Math.min(4,n))).map(v=>Number(v.toPrecision(3)));
    document.getElementById('vectorShape').textContent=state.vectorAll?C+' × '+H+' × '+W+' → '+(C*n).toLocaleString()+' entries':H+' × '+W+' → '+n.toLocaleString()+' entries in this channel';
    paintMap(document.getElementById('unrollMap'),maps.floats,C,H,W,state.channel,maps.max);
    var ctx=document.getElementById('unrollMap').getContext('2d');ctx.strokeStyle='#1e293b';ctx.lineWidth=.2;ctx.strokeRect(c+.1,r+.1,.8,.8);
    document.getElementById('vectorValues').innerHTML=(state.vectorAll?'Selected channel: ':'<b>x</b> = ')+'['+values.join(', ')+', …]';
    document.getElementById('channelBlocks').hidden=!state.vectorAll;
    document.getElementById('lastChannel').textContent='Channel '+C;
    var j=r*W+c,k=offset+j,value=activationAt(state.channel,r,c);
    document.getElementById('vectorIndex').textContent='Channel '+(state.channel+1)+', row '+r+', column '+c+' → entry '+((state.vectorAll?k:j)+1).toLocaleString()+' = '+value.toPrecision(6)+'. Rows/columns start at 0; vector entries at 1.';
    document.getElementById('vectorDimension').textContent=state.vectorAll?'Concatenate '+C+' channels in order. A1 samples 4,096 entries.':'One channel contributes '+n.toLocaleString()+' values. Select All channels to concatenate the full layer.';
    document.getElementById('poolNote').textContent='No averaging. Spatial averaging would give '+C+' values.';
    document.getElementById('oneChannel').setAttribute('aria-pressed',String(!state.vectorAll));document.getElementById('allChannels').setAttribute('aria-pressed',String(state.vectorAll));
  }
  document.getElementById('vectorMode').onclick=function(){var on=document.body.classList.toggle('vector-view');this.setAttribute('aria-pressed',String(on));this.textContent=on?'Return to maps':'Maps → vector';renderVector();};
  document.getElementById('oneChannel').onclick=function(){state.vectorAll=false;renderVector();};
  document.getElementById('allChannels').onclick=function(){state.vectorAll=true;renderVector();};
  window.cpsyNetwork={state:()=>({image:state.imageIndex,stage:state.stageIndex,channel:state.channel,row:state.row,col:state.col,vectorAll:state.vectorAll}),activationAt,shape};

  function renderNumericTable() {
    if (embed) return;
    var sh = shape();
    var H = sh[1],
      W = sh[2];
    var html = '<caption>Channel ' + (state.channel+1) + ', rows and columns numbered from zero; rounded to four significant digits.</caption><thead><tr><th scope="col">Row / column</th>';
    for (var c = 0; c < W; c++) html += '<th scope="col">' + c + '</th>';
    html += '</tr></thead><tbody>';
    for (var r = 0; r < H; r++) {
      html += '<tr><th scope="row">' + r + '</th>';
      for (c = 0; c < W; c++) {
        var v = activationAt(state.channel, r, c);
        html += '<td>' + v.toPrecision(4) + '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody>';
    els.numericMap.innerHTML = html;
  }

  function renderGallery() {
    var sh = shape();
    var C = sh[0],
      H = sh[1],
      W = sh[2];
    var maps = getMaps();
    var start = state.page * PAGE_SIZE;
    var end = Math.min(C, start + PAGE_SIZE);
    els.gallery.innerHTML = '';
    els.pageLabel.textContent =
      (start + 1) + '–' + end + ' of ' + C;
    els.prevPage.disabled = state.page <= 0;
    els.nextPage.disabled = state.page >= numPages() - 1;

    for (var ch = start; ch < end; ch++) {
      (function (channel) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ch-tile';

        btn.setAttribute('aria-pressed', channel === state.channel ? 'true' : 'false');
        btn.setAttribute(
          'aria-label',
          'Channel ' + (channel + 1) + ' of ' + C + ', spatial map ' + H + ' by ' + W
        );
        var lab = document.createElement('span');
        lab.className = 'ch-label';
        lab.textContent = String(channel + 1);
        var canvas = document.createElement('canvas');
        canvas.setAttribute('role', 'img');
        canvas.setAttribute(
          'aria-label',
          'Activation map channel ' + (channel + 1) + ', ' + H + ' rows by ' + W + ' columns'
        );
        btn.appendChild(lab);
        btn.appendChild(canvas);
        btn.addEventListener('click', function () {
          state.channel = channel;
          render();
        });
        els.gallery.appendChild(btn);
        paintMap(canvas, maps.floats, C, H, W, channel, maps.max);
      })(ch);
    }
  }

  function bindDetailHover() {
    var canvas = els.detailCanvas;
    canvas.onmousemove = function (ev) {
      var sh = shape();
      var H = sh[1],
        W = sh[2];
      var rect = canvas.getBoundingClientRect();
      var x = Math.floor(((ev.clientX - rect.left) / rect.width) * W);
      var y = Math.floor(((ev.clientY - rect.top) / rect.height) * H);
      if (x < 0 || y < 0 || x >= W || y >= H) return;
      updateReadout(true, y, x);
    };
    canvas.onmouseleave = function () {
      updateReadout(false);
    };
    canvas.onclick = function (ev) {
      var sh = shape();
      var H = sh[1],
        W = sh[2];
      var rect = canvas.getBoundingClientRect();
      var x = Math.floor(((ev.clientX - rect.left) / rect.width) * W);
      var y = Math.floor(((ev.clientY - rect.top) / rect.height) * H);
      if (x < 0 || y < 0 || x >= W || y >= H) return;
      state.row = y;
      state.col = x;
      els.rowInput.value = String(state.row);
      els.colInput.value = String(state.col);
      updateReadout(false);
    };
  }

  function render() {
    clampState();
    var im = DATA.images[state.imageIndex];
    var st = DATA.stages[state.stageIndex];
    var sh = st.shape;
    var C = sh[0],
      H = sh[1],
      W = sh[2];
    var maps = getMaps();

    els.imageSelect.value = String(state.imageIndex);

    var stageBtns = els.stageButtons.querySelectorAll('button');
    for (var i = 0; i < stageBtns.length; i++) {
      stageBtns[i].setAttribute('aria-pressed', i === state.stageIndex ? 'true' : 'false');
    }
    els.prevStage.disabled = state.stageIndex <= 0;
    els.nextStage.disabled = state.stageIndex >= DATA.stages.length - 1;

    els.stageMeta.innerHTML = '<strong>' + C + ' channels × ' + H + ' × ' + W + ' positions</strong> · ' + (st.a1Slot ? 'A1 ' + escapeHtml(st.a1Slot) + ' readout' : 'Intermediate stage');

    els.inputImg.src = im.inputSrc;
    els.inputImg.alt = 'Preprocessed model input crop for ' + im.label;

    els.preds.innerHTML = '';
    if (false && Array.isArray(im.predictions) && im.predictions.length) {  // predictions hidden: out-of-distribution inputs
      els.predsCaption.hidden = false;
      var top = im.predictions.slice(0, 3);
      top.forEach(function (p) {
        var li = document.createElement('li');
        li.innerHTML =
          '<span class="lab">' +
          escapeHtml(p.label) +
          '</span><span>' +
          (Number(p.prob) * 100).toFixed(1) +
          '%</span>';
        els.preds.appendChild(li);
      });
    } else {
      els.predsCaption.hidden = true;
    }

    els.scaleNote.textContent = 'Light: 0 · blue: ' + maps.max.toPrecision(3) + ' and above (99th percentile). Shared across channels; changes with image and layer.';

    document.querySelector('label[for="channelInput"]').textContent='Channel (1–'+C+')';
    document.querySelector('label[for="rowInput"]').textContent='Row (0–'+(H-1)+')';
    document.querySelector('label[for="colInput"]').textContent='Column (0–'+(W-1)+')';
    els.channelInput.min = 1;
    els.channelInput.max = C;
    els.channelInput.value = String(state.channel + 1);
    els.rowInput.min = 0;
    els.rowInput.max = H - 1;
    els.rowInput.value = String(state.row);
    els.colInput.min = 0;
    els.colInput.max = W - 1;
    els.colInput.value = String(state.col);

    renderGallery();

    paintMap(els.detailCanvas, maps.floats, C, H, W, state.channel, maps.max);
    var alt =
      'Enlarged activation map, channel ' +
      (state.channel + 1) +
      ' of ' +
      C +
      ', ' +
      H +
      '×' +
      W +
      ' spatial grid, shared max ' +
      maps.max.toPrecision(4);
    els.detailCanvas.setAttribute('aria-label', alt);
    els.detailAlt.textContent = alt;

    var mean = maps.pooled[state.channel];
    els.channelMean.textContent =
      'Mean across positions: ' +
      (isFiniteNumber(mean) ? mean.toPrecision(6) : 'n/a');

    updateReadout(false);
    renderNumericTable();
    bindDetailHover();
  }

  document.getElementById('strongestChannel').onclick=function(){const a=getMaps().pooled;state.channel=a.indexOf(Math.max(...a));state.row=state.col=0;render();};

  els.imageSelect.addEventListener('change', function () {
    state.imageIndex = parseInt(els.imageSelect.value, 10) || 0;
    // Keep the same channel and position when comparing different images.
    render();
  });

  els.prevStage.addEventListener('click', function () {
    if (state.stageIndex > 0) {
      state.stageIndex--;
      state.channel = 0;
      state.row = 0;
      state.col = 0;
      render();
    }
  });

  els.nextStage.addEventListener('click', function () {
    if (state.stageIndex < DATA.stages.length - 1) {
      state.stageIndex++;
      state.channel = 0;
      state.row = 0;
      state.col = 0;
      render();
    }
  });

  els.prevPage.addEventListener('click', function () {
    if (state.page > 0) {
      state.page--;
      state.channel = state.page * PAGE_SIZE;
      render();
    }
  });

  els.nextPage.addEventListener('click', function () {
    if (state.page < numPages() - 1) {
      state.page++;
      state.channel = state.page * PAGE_SIZE;
      render();
    }
  });

  els.channelInput.addEventListener('change', function () {
    var C = shape()[0];
    var v = parseInt(els.channelInput.value, 10);
    if (!isFinite(v)) v = 1;
    state.channel = Math.min(C, Math.max(1, v)) - 1;
    render();
  });

  els.rowInput.addEventListener('change', function () {
    var H = shape()[1];
    var v = parseInt(els.rowInput.value, 10);
    if (!isFinite(v)) v = 0;
    state.row = Math.min(H - 1, Math.max(0, v));
    els.rowInput.value=state.row;
    updateReadout(false);
  });

  els.colInput.addEventListener('change', function () {
    var W = shape()[2];
    var v = parseInt(els.colInput.value, 10);
    if (!isFinite(v)) v = 0;
    state.col = Math.min(W - 1, Math.max(0, v));
    els.colInput.value=state.col;
    updateReadout(false);
  });

  /* Escape only: exit interactive to parent. No other global key interception. */
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'cpsy-exit-interactive' }, '*');
      }
    }
  });

  initChrome();
  render();
})();
  </script>
</body>
</html>
