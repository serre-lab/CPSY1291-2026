<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convolution: slide one filter over the image</title>
<style>
:root{--bg:#FAF9F5;--ink:#1E293B;--muted:#64748B;--mag:#B5396B;--green:#3F7A6B;--gold:#F2C14E;--blue:#3E6D8E}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif}
main{display:grid;grid-template-columns:auto auto auto;gap:28px;align-items:start;justify-content:center;padding:14px 18px}
.panel{display:flex;flex-direction:column;align-items:center;gap:8px}
.panel h2{font-size:18px;font-weight:500;margin:0;color:var(--muted)}
canvas{image-rendering:pixelated;background:#fff;border:1px solid #d9d4cc}
.controls{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;justify-content:center;font-size:16px}
.controls label{display:flex;gap:8px;align-items:center}
button{font:inherit;padding:6px 14px;border:1px solid #c9c2b7;border-radius:8px;background:#fff;cursor:pointer}
button.primary{background:var(--gold);border-color:var(--gold)}
.stat{font-size:16px;color:var(--muted)}
.stat b{color:var(--ink);font-weight:600}
[data-embed] body{padding:0}
</style>
<script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.dataset.embed='1';</script>
<script src="convolution_data.js"></script>
</head><body><main>
<div class="panel"><h2>image (grey levels), the filter's window in magenta</h2><canvas id="img" width="96" height="96" style="width:384px;height:384px"></canvas></div>
<div class="panel"><h2>filter w (7 × 7)</h2><canvas id="flt" width="7" height="7" style="width:168px;height:168px"></canvas>
<div class="stat">at this position: <b id="dot">–</b><br><span id="relu"></span></div>
<label style="font-size:16px">filter <select id="kind"><option value="v">vertical stripes</option><option value="h">horizontal stripes</option><option value="d">diagonal stripes</option><option value="c">centre–surround</option></select></label></div>
<div class="panel"><h2>feature map: max(0, w·x) at every position</h2><canvas id="map" width="90" height="90" style="width:360px;height:360px"></canvas></div>
<div class="controls">
<button id="step" type="button">step</button><button id="run" class="primary" type="button">slide</button><button id="all" type="button">finish</button><button id="reset" type="button">reset</button>
<label>speed <input id="speed" type="range" min="1" max="60" value="12"></label>
<span class="stat">position <b id="pos">0, 0</b> of 90 × 90</span>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const IMG=window.CONV_IMAGE, N=IMG.length, K=7, M=N-K+1;
function gabor(theta){const s=1.6,lam=4.0,o=[];for(let y=0;y<K;y++){const r=[];for(let x=0;x<K;x++){const u=x-3,v=y-3;const ur=u*Math.cos(theta)+v*Math.sin(theta);const vr=-u*Math.sin(theta)+v*Math.cos(theta);r.push(Math.exp(-(ur*ur+0.6*vr*vr)/(2*s*s))*Math.cos(2*Math.PI*ur/lam));}o.push(r);}return zeroMean(o);}
function dog(){const o=[];for(let y=0;y<K;y++){const r=[];for(let x=0;x<K;x++){const u=x-3,v=y-3,d=u*u+v*v;r.push(Math.exp(-d/(2*1.0))-0.45*Math.exp(-d/(2*2.6)));}o.push(r);}return zeroMean(o);}
function zeroMean(f){let s=0;for(const r of f)for(const v of r)s+=v;const m=s/(K*K);let n=0;for(const r of f)for(const v of r)n+=(v-m)*(v-m);n=Math.sqrt(n);return f.map(r=>r.map(v=>(v-m)/n));}
const FILTERS={v:()=>gabor(0),h:()=>gabor(Math.PI/2),d:()=>gabor(Math.PI/4),c:dog};
let W=FILTERS.v(), pos=0, out=new Float32Array(M*M), done=new Uint8Array(M*M), timer=null;
function patchMean(i,j){let s=0;for(let y=0;y<K;y++)for(let x=0;x<K;x++)s+=IMG[i+y][j+x];return s/(K*K);}
function response(i,j){let s=0;const m=patchMean(i,j);for(let y=0;y<K;y++)for(let x=0;x<K;x++)s+=W[y][x]*(IMG[i+y][j+x]-m);return s;}
function drawImage(){const c=$('img'),g=c.getContext('2d'),d=g.createImageData(N,N);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=Math.round(IMG[y][x]*255),k=4*(y*N+x);d.data[k]=d.data[k+1]=d.data[k+2]=v;d.data[k+3]=255;}g.putImageData(d,0,0);const i=Math.floor(pos/M),j=pos%M;g.strokeStyle='#B5396B';g.lineWidth=1;g.strokeRect(j+0.5,i+0.5,K-1,K-1);}
function drawFilter(){const c=$('flt'),g=c.getContext('2d'),d=g.createImageData(K,K);let mx=0;for(const r of W)for(const v of r)mx=Math.max(mx,Math.abs(v));for(let y=0;y<K;y++)for(let x=0;x<K;x++){const v=W[y][x]/mx,k=4*(y*K+x);if(v>=0){d.data[k]=181;d.data[k+1]=57;d.data[k+2]=107;d.data[k+3]=Math.round(255*v);}else{d.data[k]=62;d.data[k+1]=109;d.data[k+2]=142;d.data[k+3]=Math.round(-255*v);}}g.fillStyle='#fff';g.fillRect(0,0,K,K);g.putImageData(d,0,0);}
function drawMap(){const c=$('map'),g=c.getContext('2d'),d=g.createImageData(M,M);let mx=1e-6;for(let k=0;k<M*M;k++)if(done[k])mx=Math.max(mx,out[k]);for(let k=0;k<M*M;k++){const q=4*k;if(!done[k]){d.data[q]=240;d.data[q+1]=238;d.data[q+2]=233;}else{const v=Math.round(255*Math.max(0,out[k])/mx);d.data[q]=d.data[q+1]=d.data[q+2]=v;}d.data[q+3]=255;}g.putImageData(d,0,0);}
function show(){const i=Math.floor(pos/M),j=pos%M;$('pos').textContent=`${i}, ${j}`;const r=response(i,j);$('dot').textContent=r.toFixed(2);$('relu').textContent=r>0?'positive: the window matches the filter':'negative or zero: ReLU writes 0';drawImage();drawMap();}
function stepOnce(){if(pos>=M*M)return false;const i=Math.floor(pos/M),j=pos%M;out[pos]=response(i,j);done[pos]=1;pos++;return pos<M*M;}
function stop(){if(timer){clearInterval(timer);timer=null;$('run').textContent='slide';}}
$('step').onclick=()=>{stop();stepOnce();show();};
$('run').onclick=()=>{if(timer){stop();return;}$('run').textContent='pause';timer=setInterval(()=>{const n=+$('speed').value;for(let k=0;k<n;k++)if(!stepOnce()){stop();break;}show();},40);};
$('all').onclick=()=>{stop();while(stepOnce());pos=M*M-1;show();};
$('reset').onclick=()=>{stop();pos=0;out.fill(0);done.fill(0);show();};
$('kind').onchange=()=>{W=FILTERS[$('kind').value]();drawFilter();$('reset').onclick();};
drawFilter();show();
</script></body></html>
