<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orientation-tuning playground — CPSY 1291</title>
<style>
  :root{
    --sienna:#9C5A2E; --slate:#3E6D8E; --teal:#3F7A6B;
    --cream:#FAF9F5; --ink:#1E293B; --muted:#5B6B7A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);
    font-family:"Helvetica Neue",Arial,system-ui,sans-serif;height:100%;}
  #app{display:flex;flex-direction:row;gap:30px;align-items:center;
    justify-content:center;padding:24px 28px;height:100%;}
  h1{font-size:28px;margin:0 0 2px 0;font-weight:700;}
  .sub{font-size:17px;color:var(--muted);margin:0 0 14px 0;}
  canvas{background:var(--cream);border-radius:10px;display:block;}
  .panels{display:flex;gap:22px;align-items:flex-end;}
  .panel{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .panel .cap{font-size:16px;font-weight:700;}
  .cap-w{color:var(--sienna);} .cap-x{color:var(--slate);}
  #right{display:flex;flex-direction:column;justify-content:center;min-width:0;}
  .slider-row{display:grid;grid-template-columns:120px 1fr 92px;align-items:center;
    gap:14px;margin:6px 0 4px 0;}
  .slider-row label{font-size:22px;font-weight:700;color:var(--slate);}
  .slider-row .val{font-size:24px;font-variant-numeric:tabular-nums;text-align:right;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;
    border-radius:6px;background:#d9d2c6;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:30px;height:30px;border-radius:50%;background:var(--slate);
    border:3px solid var(--cream);box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;
    background:var(--slate);border:3px solid var(--cream);cursor:pointer;}
  .readout{font-size:22px;margin-top:6px;}
  .readout b{color:var(--teal);font-weight:800;}
  .btnrow{margin-top:12px;display:flex;gap:10px;}
  button{font-size:18px;font-weight:700;padding:9px 18px;border-radius:8px;
    border:2px solid var(--slate);background:#fff;color:var(--slate);cursor:pointer;}
  button:hover{background:var(--slate);color:#fff;}
</style>
</head>
<body>
<div id="app">
  <!-- LEFT: receptive field + stimulus -->
  <div class="panel" style="gap:14px;">
    <div class="panels">
      <div class="panel">
        <canvas id="rf" width="200" height="200"></canvas>
        <div class="cap cap-w">weight kernel&nbsp;&nbsp;w&nbsp;(Gabor)</div>
      </div>
      <div class="panel">
        <canvas id="stim" width="200" height="200"></canvas>
        <div class="cap cap-x">stimulus&nbsp;&nbsp;x&nbsp;(grating)</div>
      </div>
    </div>
  </div>

  <!-- RIGHT: controls + tuning curve -->
  <div id="right">
    <h1>Orientation-tuning playground</h1>
    <p class="sub">Rotate the grating &rarr; watch the simple cell trace its tuning curve.
      &nbsp; response&nbsp;<b style="color:var(--teal)">a</b> = g(<b style="color:var(--sienna)">w</b>&middot;<b style="color:var(--slate)">x</b>)</p>

    <div class="slider-row">
      <label>orientation</label>
      <input type="range" id="theta" min="0" max="180" step="1" value="0">
      <span class="val" id="thetav">0&deg;</span>
    </div>

    <canvas id="curve" width="560" height="300"></canvas>

    <div class="readout">response&nbsp; <b id="resp">1.00</b>
      &nbsp;<span style="color:var(--muted);font-size:18px;" id="hint">(at the preferred orientation — maximal)</span></div>
    <div class="btnrow">
      <button id="sweep">&#9654; sweep</button>
      <button id="pref">jump to preferred</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const N = 56;                 // grid resolution for the dot product
  const EXT = 3.0;              // spatial half-width
  const SIG = 0.95, LAM = 1.7;  // Gabor envelope / wavelength
  const THETA_PREF = 0;         // preferred orientation (deg): vertical stripes

  // ---- build coordinate grid ----
  const xs = new Float32Array(N*N), ys = new Float32Array(N*N);
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const i=r*N+c;
    xs[i] = -EXT + 2*EXT*c/(N-1);
    ys[i] = -EXT + 2*EXT*r/(N-1);
  }
  // ---- fixed Gabor weight kernel (cosine phase, vertical preferred) ----
  const K = new Float32Array(N*N);
  for(let i=0;i<N*N;i++){
    const x=xs[i], y=ys[i];                 // theta_pref = 0 -> x'=x
    const env = Math.exp(-(x*x + 0.65*0.65*y*y)/(2*SIG*SIG));
    K[i] = env*Math.cos(2*Math.PI*x/LAM);
  }
  let kmax=0; for(let i=0;i<N*N;i++) kmax=Math.max(kmax,Math.abs(K[i]));

  function grating(thetaDeg){
    const t = thetaDeg*Math.PI/180;
    const ct=Math.cos(t), st=Math.sin(t);
    const S = new Float32Array(N*N);
    for(let i=0;i<N*N;i++){
      const xp = xs[i]*ct + ys[i]*st;
      S[i] = 0.5*(1+Math.cos(2*Math.PI*xp/LAM));   // in [0,1]
    }
    return S;
  }
  function respRaw(thetaDeg){
    const S = grating(thetaDeg);
    let s=0; for(let i=0;i<N*N;i++) s += K[i]*S[i];
    return Math.max(0,s);
  }
  // precompute tuning curve (0..180) and its max for normalisation
  const TUNE = new Float32Array(181);
  let tmax=0; for(let d=0;d<=180;d++){ TUNE[d]=respRaw(d); tmax=Math.max(tmax,TUNE[d]); }
  const norm = d => TUNE[d]/tmax;

  // ---- colour helpers ----
  function lerp(a,b,t){return a+(b-a)*t;}
  function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  const SLATE=hex("#3E6D8E"), CREAMc=hex("#FAF9F5"), SIEN=hex("#9C5A2E");
  function diverge(t){ // t in [-1,1] -> slate..cream..sienna
    let a,b,u;
    if(t<0){a=SLATE;b=CREAMc;u=t+1;} else {a=CREAMc;b=SIEN;u=t;}
    return `rgb(${lerp(a[0],b[0],u)|0},${lerp(a[1],b[1],u)|0},${lerp(a[2],b[2],u)|0})`;
  }
  function grayLight(v){ // stimulus: dark->light slate
    const a=hex("#1E293B"), b=hex("#CFE0EC");
    return `rgb(${lerp(a[0],b[0],v)|0},${lerp(a[1],b[1],v)|0},${lerp(a[2],b[2],v)|0})`;
  }

  function drawField(canvas, arr, mode){
    const ctx=canvas.getContext("2d");
    const W=canvas.width, px=W/N;
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      const i=r*N+c;
      ctx.fillStyle = mode==="w" ? diverge(arr[i]/kmax) : grayLight(arr[i]);
      ctx.fillRect(c*px, (N-1-r)*px, px+1, px+1);
    }
  }

  // ---- tuning-curve canvas ----
  const cc = document.getElementById("curve");
  const cx = cc.getContext("2d");
  const M = {l:54,r:14,t:14,b:42};
  const PW = cc.width-M.l-M.r, PH = cc.height-M.t-M.b;
  const px = d => M.l + d/180*PW;
  const py = v => M.t + (1-v)*PH;

  function drawCurve(curDeg){
    cx.clearRect(0,0,cc.width,cc.height);
    // axes
    cx.strokeStyle="#B9B0A2"; cx.lineWidth=2;
    cx.beginPath(); cx.moveTo(M.l,M.t); cx.lineTo(M.l,M.t+PH); cx.lineTo(M.l+PW,M.t+PH); cx.stroke();
    cx.fillStyle="#5B6B7A"; cx.font="15px Helvetica,Arial";
    [0,45,90,135,180].forEach(d=>{
      cx.textAlign="center"; cx.fillText(d+"°", px(d), M.t+PH+22);
      cx.strokeStyle="#ece6db"; cx.beginPath(); cx.moveTo(px(d),M.t); cx.lineTo(px(d),M.t+PH); cx.stroke();
    });
    cx.save(); cx.translate(16,M.t+PH/2); cx.rotate(-Math.PI/2);
    cx.textAlign="center"; cx.fillStyle="#3F7A6B"; cx.font="16px Helvetica,Arial";
    cx.fillText("response  a",0,0); cx.restore();
    cx.fillStyle="#1E293B"; cx.textAlign="center";
    cx.fillText("grating orientation", M.l+PW/2, M.t+PH+40);

    // preferred-orientation marker
    cx.strokeStyle="#9C5A2E"; cx.setLineDash([6,5]); cx.lineWidth=2.5;
    cx.beginPath(); cx.moveTo(px(THETA_PREF),M.t); cx.lineTo(px(THETA_PREF),M.t+PH); cx.stroke();
    cx.setLineDash([]);

    // the swept part of the curve, up to curDeg (the "trace")
    cx.strokeStyle="#3F7A6B"; cx.lineWidth=4; cx.beginPath();
    for(let d=0; d<=curDeg; d++){ const X=px(d),Y=py(norm(d)); d?cx.lineTo(X,Y):cx.moveTo(X,Y); }
    cx.stroke();
    // faint full curve underneath as a guide
    cx.strokeStyle="rgba(63,122,107,0.22)"; cx.lineWidth=2; cx.beginPath();
    for(let d=0; d<=180; d++){ const X=px(d),Y=py(norm(d)); d?cx.lineTo(X,Y):cx.moveTo(X,Y); }
    cx.stroke();

    // moving dot
    const X=px(curDeg), Y=py(norm(curDeg));
    cx.fillStyle="#3F7A6B"; cx.beginPath(); cx.arc(X,Y,8,0,2*Math.PI); cx.fill();
    cx.strokeStyle="#fff"; cx.lineWidth=2.5; cx.stroke();
  }

  // ---- wire up ----
  const elTheta=document.getElementById("theta");
  const rfC=document.getElementById("rf"), stC=document.getElementById("stim");
  drawField(rfC, K, "w");

  function render(){
    const d=+elTheta.value;
    document.getElementById("thetav").textContent=d+"°";
    drawField(stC, grating(d), "x");
    drawCurve(d);
    document.getElementById("resp").textContent = norm(d).toFixed(2);
    const h=document.getElementById("hint");
    h.textContent = norm(d) > 0.9 ? "(near the preferred orientation — maximal)"
                   : norm(d) < 0.1 ? "(orthogonal to preferred — silent)" : "";
  }
  elTheta.addEventListener("input", render);
  document.getElementById("pref").addEventListener("click",()=>{elTheta.value=THETA_PREF;render();});

  let sweeping=false, raf=null;
  document.getElementById("sweep").addEventListener("click",()=>{
    if(sweeping){sweeping=false;cancelAnimationFrame(raf);return;}
    sweeping=true; let d=0;
    (function step(){ if(!sweeping)return; elTheta.value=d; render();
      d+=2; if(d>180){sweeping=false;return;} raf=requestAnimationFrame(step); })();
  });

  render();
})();
</script>
</body>
</html>
