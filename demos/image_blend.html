<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel interpolation — CPSY 1291</title>
<style>
:root{
  --paper:#FAF9F5; --ink:#1E293B; --body:#334155; --muted:#5B6B7A;
  --x:#3E6D8E; --y:#B5396B; --result:#3F7A6B;
  --line:#B0AAA0; --focus:#0969da;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--body);
  font:20px/1.35 "Helvetica Neue",Arial,system-ui,sans-serif}
body{min-height:100vh}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.wrap{max-width:1680px;margin:0 auto;padding:14px 16px 18px}
.eyebrow{margin:0 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#704829}
h1{margin:0 0 10px;font-size:28px;line-height:1.2;color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:0 0 12px}
.toolbar i{font-weight:400}
.toolbar label{display:inline-flex;align-items:center;gap:8px;font-size:18px;color:var(--ink);font-weight:600}
select,button,input[type=number]{font:inherit;font-size:18px;color:var(--ink);background:var(--paper);
  border:1px solid #64748b;border-radius:4px;padding:6px 10px;min-height:40px}
button{cursor:pointer}
button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
input[type=range]{width:220px;accent-color:#3E6D8E}
output{font-variant-numeric:tabular-nums;min-width:3.2em}
.stage{display:grid;grid-template-columns:1fr;gap:12px}
.images{display:flex;flex-wrap:wrap;justify-content:center;gap:28px;align-items:flex-start}
figure{margin:0;text-align:center}
figcaption{margin-top:6px;font-size:18px;line-height:1.25;color:var(--ink)}
canvas{width:160px;height:160px;max-width:160px;aspect-ratio:1;image-rendering:pixelated;
  display:block;cursor:crosshair;background:var(--paper);border:1px solid var(--line)}
.pixel-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:4px}
.pixel-controls label{font-size:17px;font-weight:600;color:var(--ink);gap:6px;display:inline-flex;align-items:center}
.pixel-controls input{width:64px}
.math{font-family:ui-serif,"Times New Roman",Times,serif;font-size:22px;line-height:1.4;color:var(--ink)}
.math b{font-weight:700;font-style:normal}
#capX b,label[for=pickX]>b{color:var(--x)}
#capY b,label[for=pickY]>b{color:var(--y)}
.images figure:nth-child(2) figcaption,.images figure:nth-child(2) figcaption .math{color:var(--result)}
#vecLine b:nth-of-type(1){color:var(--x)}
#vecLine b:nth-of-type(2){color:var(--y)}
#vecLine b:nth-of-type(3){color:var(--result)}
.math i,.component{font-weight:400;font-style:italic}
.eq{margin:4px 0 0}
.readout{min-height:3.2em;margin:8px 0 0;font-size:20px;line-height:1.4;color:var(--ink)}
.vec-line{margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim{margin:0;font-size:17px;color:var(--muted)}
.footer{margin-top:12px;font-size:14px;color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
html.embed body{overflow:hidden}
html.embed .wrap{max-width:none;width:100%;height:100vh;padding:8px 12px;overflow:hidden}
html.embed .eyebrow,html.embed .footer,html.embed .standalone{display:none}
html.embed h1{display:none}
html.embed .toolbar{margin:0 0 8px;gap:8px 12px}
html.embed .toolbar label,html.embed select,html.embed button,html.embed input[type=number]{font-size:20px}
html.embed .math{font-size:24px}
html.embed .readout{font-size:22px;min-height:2.8em}
html.embed .images{gap:36px}
@media (max-width:900px){
  html.embed body,html.embed .wrap{overflow:auto;height:auto;width:100%}
  .images{gap:16px}
  .vec-line{white-space:normal}
}
</style>
<script>
if(new URLSearchParams(location.search).has('embed')){
  document.documentElement.classList.add('embed');
}
</script>
</head>
<body>
<div class="wrap">
  <p class="eyebrow standalone">CPSY 1291 · Lecture 1</p>
  <h1>Pixel interpolation</h1>

  <div class="toolbar" role="group" aria-label="Blend controls">
    <label for="pickX"><b>x</b>
      <select id="pickX" aria-label="Source image x"></select>
    </label>
    <label for="pickY"><b>y</b>
      <select id="pickY" aria-label="Source image y"></select>
    </label>
    <label for="lambda">Scalar <i>λ</i>
      <input id="lambda" type="range" min="0" max="1" step="0.05" value="0.5"
        aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.5"
        aria-label="Interpolation weight lambda">
      <output id="lambdaOut" for="lambda">0.50</output>
    </label>
    <button type="button" id="btn0" aria-label="Set lambda to 0"><i>λ</i> = 0</button>
    <button type="button" id="btnAvg" aria-label="Set lambda to 0.5, the average">Average</button>
    <button type="button" id="btn1" aria-label="Set lambda to 1"><i>λ</i> = 1</button>
  </div>

  <div class="stage">
    <div class="images" aria-label="Source and blended 28 by 28 images">
      <figure>
        <canvas id="canvasX" width="168" height="168" tabindex="0"
          role="img" aria-label="Original image x, 28 by 28. Click or use arrow keys to select a pixel."></canvas>
        <figcaption id="capX"><b>x</b></figcaption>
      </figure>
      <figure>
        <canvas id="canvasB" width="168" height="168" tabindex="0"
          role="img" aria-label="Blended image, 28 by 28. Click or use arrow keys to select a pixel."></canvas>
        <figcaption><span class="math">(1 − <i>λ</i>)<b>x</b> + <i>λ</i><b>y</b></span></figcaption>
      </figure>
      <figure>
        <canvas id="canvasY" width="168" height="168" tabindex="0"
          role="img" aria-label="Original image y, 28 by 28. Click or use arrow keys to select a pixel."></canvas>
        <figcaption id="capY"><b>y</b></figcaption>
      </figure>
    </div>

    <div class="pixel-controls">
      <label>Row <input id="row" type="number" min="1" max="28" value="14" aria-label="Selected pixel row"></label>
      <label>Column <input id="col" type="number" min="1" max="28" value="14" aria-label="Selected pixel column"></label>
      <span class="dim">Intensities 0–255 · same scale on all three panels</span>
    </div>

    <div class="math">
      <p class="eq vec-line" id="vecLine"></p>
      <p class="eq" id="midHint">When <i>λ</i> = 0.5, the blend is (<b>x</b> + <b>y</b>) / 2.</p>
      <p class="dim" id="dimLine"><b>x</b>, <b>y</b> ∈ ℝ<sup>784</sup> · row order</p>
    </div>
    <div id="readout" class="readout" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <p class="footer standalone">Same 28 × 28 grayscale arrays as the pixel explorer (Peterson et al. <i>Cognitive Science</i> 2018 stimulus set). Escape exits when embedded.</p>
  <div class="sr-only" id="live" aria-live="polite"></div>
</div>

<script src="L01_image_blend_data.js"></script>
<script>
(function(){
  const images = window.L01_BLEND_IMAGES;
  if(!Array.isArray(images) || !images.length){
    document.body.insertAdjacentHTML('afterbegin',
      '<p role="alert">Missing L01_image_blend_data.js (window.L01_BLEND_IMAGES).</p>');
    return;
  }

  const $ = id => document.getElementById(id);
  const ctxX = $('canvasX').getContext('2d');
  const ctxY = $('canvasY').getContext('2d');
  const ctxB = $('canvasB').getContext('2d');

  function findName(name){
    const i = images.findIndex(im => im.name === name);
    return i >= 0 ? i : 0;
  }
  let ix = findName('Tiger');
  let iy = findName('Gorilla');
  if(ix === iy) iy = (ix + 1) % images.length;
  let lambda = 0.5;
  let row = 13, col = 13;

  images.forEach((im, i) => {
    const ox = document.createElement('option');
    ox.value = String(i); ox.textContent = im.name;
    $('pickX').append(ox);
    const oy = document.createElement('option');
    oy.value = String(i); oy.textContent = im.name;
    $('pickY').append(oy);
  });
  $('pickX').value = String(ix);
  $('pickY').value = String(iy);

  function fmt(v){
    if(!Number.isFinite(v)) return String(v);
    const r = Math.round(v * 1e9) / 1e9;
    return Number.isInteger(r) ? String(r) : String(r);
  }

  function blendPixels(x, y, lam){
    const out = new Array(784);
    const a = 1 - lam;
    for(let i = 0; i < 784; i++) out[i] = a * x[i] + lam * y[i];
    return out;
  }

  function paint(ctx, arr, markRow, markCol){
    const cell = 6;
    ctx.clearRect(0, 0, 168, 168);
    for(let i = 0; i < 784; i++){
      const q = Math.max(0, Math.min(255, Math.round(arr[i])));
      ctx.fillStyle = `rgb(${q},${q},${q})`;
      ctx.fillRect((i % 28) * cell, Math.floor(i / 28) * cell, cell, cell);
    }
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 2;
    ctx.strokeRect(markCol * cell + 0.5, markRow * cell + 0.5, cell - 1, cell - 1);
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 1;
    ctx.strokeRect(markCol * cell + 1.5, markRow * cell + 1.5, cell - 3, cell - 3);
  }

  function publish(x, y, blend){
    const j = row * 28 + col;
    window.L01Blend = {
      lambda,
      x: x.slice(),
      y: y.slice(),
      blend: blend.slice(),
      names: [images[ix].name, images[iy].name],
      index: j
    };
  }

  function render(){
    const x = images[ix].pixels;
    const y = images[iy].pixels;
    const blend = blendPixels(x, y, lambda);

    $('lambda').value = String(lambda);
    $('lambda').setAttribute('aria-valuenow', String(lambda));
    $('lambdaOut').value = lambda.toFixed(2);
    $('capX').innerHTML = `<b>x</b> · ${images[ix].name}`;
    $('capY').innerHTML = `<b>y</b> · ${images[iy].name}`;

    paint(ctxX, x, row, col);
    paint(ctxY, y, row, col);
    paint(ctxB, blend, row, col);

    const head = a => a.slice(0, 4).map(fmt).join(', ');
    $('vecLine').innerHTML =
      `<b>x</b>: [${head(x)}, …] · <b>y</b>: [${head(y)}, …] · <b>z</b>: [${head(blend)}, …]`;

    const j = row * 28 + col;
    const xj = x[j], yj = y[j], bj = blend[j];
    const a = 1 - lambda;
    $('readout').innerHTML =
      `Row ${row + 1}, column ${col + 1} · entry <span class="component">j</span> = ${j + 1}. ` +
      `<span class="component">x<sub>j</sub></span> = ${fmt(xj)}, ` +
      `<span class="component">y<sub>j</sub></span> = ${fmt(yj)}. ` +
      `<span class="component">z<sub>j</sub></span> = (1 − <i>λ</i>)<span class="component">x<sub>j</sub></span> + <i>λ</i><span class="component">y<sub>j</sub></span> ` +
      `= ${fmt(a)}·${fmt(xj)} + ${fmt(lambda)}·${fmt(yj)} = ${fmt(bj)}.`;
    $('live').textContent =
      `Selected pixel row ${row + 1}, column ${col + 1}. ` +
      `x_j ${fmt(xj)}, y_j ${fmt(yj)}, blend ${fmt(bj)}.`;

    $('btn0').setAttribute('aria-pressed', lambda === 0 ? 'true' : 'false');
    $('btnAvg').setAttribute('aria-pressed', lambda === 0.5 ? 'true' : 'false');
    $('btn1').setAttribute('aria-pressed', lambda === 1 ? 'true' : 'false');

    publish(x, y, blend);
  }

  function setLambda(v){
    lambda = Math.max(0, Math.min(1, Math.round(Number(v) * 20) / 20));
    render();
  }

  function readSelection(){
    row = Math.max(0, Math.min(27, Number($('row').value || 1) - 1));
    col = Math.max(0, Math.min(27, Number($('col').value || 1) - 1));
    $('row').value = row + 1;
    $('col').value = col + 1;
    render();
  }

  function pointFromEvent(e, canvas){
    const b = canvas.getBoundingClientRect();
    col = Math.min(27, Math.max(0, Math.floor((e.clientX - b.left) * 28 / b.width)));
    row = Math.min(27, Math.max(0, Math.floor((e.clientY - b.top) * 28 / b.height)));
    $('row').value = row + 1;
    $('col').value = col + 1;
    render();
  }

  function onCanvasKey(e){
    const moves = {ArrowLeft:[0,-1], ArrowRight:[0,1], ArrowUp:[-1,0], ArrowDown:[1,0]};
    if(!moves[e.key]) return;
    e.preventDefault();
    const [dr, dc] = moves[e.key];
    row = Math.max(0, Math.min(27, row + dr));
    col = Math.max(0, Math.min(27, col + dc));
    $('row').value = row + 1;
    $('col').value = col + 1;
    render();
  }

  $('pickX').addEventListener('change', () => {
    ix = Number($('pickX').value);
    if(ix === iy){
      iy = (ix + 1) % images.length;
      $('pickY').value = String(iy);
    }
    render();
  });
  $('pickY').addEventListener('change', () => {
    iy = Number($('pickY').value);
    if(iy === ix){
      ix = (iy + 1) % images.length;
      $('pickX').value = String(ix);
    }
    render();
  });
  $('lambda').addEventListener('input', () => setLambda($('lambda').value));
  $('lambda').addEventListener('change', () => setLambda($('lambda').value));
  $('btn0').addEventListener('click', () => setLambda(0));
  $('btnAvg').addEventListener('click', () => setLambda(0.5));
  $('btn1').addEventListener('click', () => setLambda(1));
  $('row').addEventListener('input', readSelection);
  $('col').addEventListener('input', readSelection);

  for(const id of ['canvasX', 'canvasY', 'canvasB']){
    const el = $(id);
    el.addEventListener('click', e => pointFromEvent(e, el));
    el.addEventListener('keydown', onCanvasKey);
  }

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && window.parent !== window){
      window.parent.postMessage({type: 'cpsy-exit-interactive'}, '*');
    }
  });

  render();
})();
</script>
</body>
</html>
