<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image representations and Euclidean distance</title>
<style>
:root{--paper:#FAF9F5;--ink:#1E293B;--body:#334155;--line:#64748B}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:24px/1.4 'Helvetica Neue',Arial,sans-serif}.wrap{padding:12px 18px;max-width:1680px;margin:auto}.toolbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:12px}button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px 16px;cursor:pointer}button[aria-pressed=true]{background:var(--ink);color:var(--paper)}:focus-visible{outline:3px solid #0969DA;outline-offset:4px}.motion{margin-left:auto;font-size:20px}input{width:20px;height:20px;accent-color:#3E6D8E}.stage{display:grid;grid-template-columns:350px minmax(0,1fr);gap:24px}.photos{display:flex;flex-direction:column;gap:12px;padding-top:18px}.photo{display:flex;align-items:center;gap:18px;margin:0;padding:6px;border:3px solid transparent;border-radius:4px;cursor:pointer}.photo.active{border-color:#3E6D8E}.photo img{width:126px;height:126px;object-fit:contain;border:1px solid #B0AAA0}.photo figcaption{font-size:25px}.photo small{display:block;font-size:20px;color:var(--body)}.plot{min-width:0}svg{display:block;width:100%;height:430px;overflow:visible}svg text{font-family:'Helvetica Neue',Arial,sans-serif;font-size:25px;fill:var(--ink)}.edge-label{paint-order:stroke;stroke:var(--paper);stroke-width:12px;stroke-linejoin:round}.edge{stroke:var(--line);stroke-width:2}.point{stroke:var(--paper);stroke-width:3;cursor:pointer}.point:focus{outline:none;stroke:#0969DA;stroke-width:6}.status{font-size:24px;margin:0 0 6px;min-height:34px}table{border-collapse:collapse;font-size:21px;margin:6px auto 0;min-width:70%}caption{font-size:20px;margin-bottom:4px}th,td{padding:4px 14px;text-align:center;border-bottom:1px solid #B0AAA0}p.note{margin:10px 0 0;font-size:20px;color:var(--body)}h1{font-size:28px}.embed h1{display:none}.embed .wrap{height:100vh;overflow:hidden}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:950px){.stage{grid-template-columns:1fr}.photos{flex-direction:row;justify-content:center}.photo{display:block}.photo img{width:95px;height:95px}.photo figcaption{font-size:18px}.photo small{font-size:16px}.embed .wrap{height:auto;overflow:auto}.motion{margin-left:0}svg{height:350px}}
.embed .wrap{padding:4px 12px}.embed .stage{grid-template-columns:430px minmax(0,1fr);gap:36px}.embed .photo img{width:190px;height:190px}.embed .photo figcaption{font-size:32px}.embed .photo small{font-size:24px}.embed svg{height:600px}.embed svg text{font-size:34px}.embed .status{font-size:28px}.embed table,.embed .note{display:none}.embed button{font-size:26px}</style></head><body><main class="wrap"><h1>Which image is closer?</h1>
<div class="toolbar" role="group" aria-label="Choose representation"><button data-mode="pixels" aria-pressed="true">Pixels · 784 values</button><button data-mode="network" aria-pressed="false">ResNet-18 · 4,096 responses</button><label class="motion"><input id="motion" type="checkbox" checked> Animate change</label></div>
<div class="stage"><div class="photos" aria-label="The same three images"></div><div class="plot"><p class="status" aria-live="polite"></p>
<svg viewBox="0 0 1000 470" role="group" aria-label="An exact three-image plane preserving Euclidean distances"><g id="edges"></g><g id="labels"></g><g id="points"></g></svg>
<table><caption id="units">Euclidean distances · pixel intensity units</caption><thead><tr><th scope="col">A–B · two tigers</th><th scope="col">A–C · tiger–monkey</th><th scope="col">B–C · tiger–monkey</th></tr></thead><tbody><tr id="values"></tr></tbody></table>
</div></div><p class="note">All three distances are preserved within each map. Display scales differ; the axes are not individual features.</p></main>
<script src="animal_distances_data.js"></script><script>
'use strict';
if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed');
const data=window.L01_ANIMAL_DISTANCES,NS='http://www.w3.org/2000/svg',pairs=[[0,1],[0,2],[1,2]],colors=['#3E6D8E','#B5396B','#3F7A6B'],motion=matchMedia('(prefers-reduced-motion: reduce)'),motionBox=document.querySelector('#motion');motionBox.checked=!motion.matches;
let current=[],mode='pixels',frame=0;
function svg(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);document.querySelector(parent).append(e);return e}
const lines=pairs.map(()=>svg('line',{class:'edge'},'#edges')),labs=pairs.map(()=>svg('text',{class:'edge-label','text-anchor':'middle'},'#labels'));
const nodes=data.images.map((im,i)=>{const fig=document.createElement('figure');fig.className='photo';fig.tabIndex=0;fig.setAttribute('aria-label',im.label);const image=document.createElement('img');image.src=im.src;image.alt=im.label+' photograph';fig.append(image);const cap=document.createElement('figcaption');cap.textContent=im.label;const small=document.createElement('small');small.textContent=i===0?'Reference image':i===1?'Same category':'Different category';cap.append(small);fig.append(cap);document.querySelector('.photos').append(fig);const circle=svg('circle',{r:10,fill:colors[i],class:'point',tabindex:0,'aria-label':im.label},'#points'),label=svg('text',{'text-anchor':'middle'},'#points');label.textContent='ABC'[i];for(const el of [circle,fig]){el.addEventListener('mouseenter',()=>highlight(i));el.addEventListener('mouseleave',()=>highlight(-1));el.addEventListener('focus',()=>highlight(i));el.addEventListener('blur',()=>highlight(-1));}return{fig,circle,label};});
function highlight(i){nodes.forEach((n,k)=>{n.fig.classList.toggle('active',i===k);n.circle.setAttribute('r',i===k?14:10)});}
function positions(key){const q=data.modes[key].coordinates;const width=q[1][0],height=q[2][1],scale=Math.min(650/width,310/height),left=(1000-width*scale)/2;return q.map(p=>[left+p[0]*scale,400-p[1]*scale]);}
function draw(q){current=q;nodes.forEach((n,i)=>{n.circle.setAttribute('cx',q[i][0]);n.circle.setAttribute('cy',q[i][1]);n.label.setAttribute('x',q[i][0]+(i===0?-27:i===1?27:0));n.label.setAttribute('y',q[i][1]+(i===2?-24:8));});pairs.forEach(([i,j],k)=>{lines[k].setAttribute('x1',q[i][0]);lines[k].setAttribute('y1',q[i][1]);lines[k].setAttribute('x2',q[j][0]);lines[k].setAttribute('y2',q[j][1]);labs[k].setAttribute('x',(q[i][0]+q[j][0])/2+(k===1?-48:k===2?48:0));labs[k].setAttribute('y',(q[i][1]+q[j][1])/2+(k===0?38:0));});}
function finish(){const m=data.modes[mode];pairs.forEach(([i,j],k)=>{labs[k].textContent=m.distances[i][j].toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})});document.querySelector('#labels').style.visibility='visible';document.querySelector('#values').innerHTML=pairs.map(([i,j])=>'<td>'+m.distances[i][j].toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})+'</td>').join('');document.querySelector('#units').textContent='Euclidean distances · '+(mode==='pixels'?'pixel intensity units':'stored activation units');document.querySelector('.status').textContent=mode==='pixels'?'Pixels: the monkey is closer to tiger A than tiger B is.':'Network responses: the two tigers are closer.';window.L01Animal.state={mode,coordinates:current,distances:m.distances,animating:false};}
function change(key,animate=true){cancelAnimationFrame(frame);mode=key;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===key));const dest=positions(key);window.L01Animal.state={mode,animating:false};if(!animate||!current.length||!motionBox.checked||motion.matches){draw(dest);finish();return}const start=current.map(p=>p.slice()),t0=performance.now();document.querySelector('#labels').style.visibility='hidden';document.querySelector('#values').innerHTML='<td colspan="3">Changing representation…</td>';document.querySelector('.status').textContent='Changing representation…';window.L01Animal.state.animating=true;const tick=t=>{const u=Math.min(1,(t-t0)/850),v=u*u*(3-2*u);draw(start.map((p,i)=>p.map((a,j)=>a+(dest[i][j]-a)*v)));if(u<1)frame=requestAnimationFrame(tick);else finish()};frame=requestAnimationFrame(tick)}
window.L01Animal={show:change,state:{}};document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>change(b.dataset.mode)));motionBox.addEventListener('change',()=>{if(!motionBox.checked)change(mode,false)});motion.addEventListener('change',()=>{if(motion.matches){motionBox.checked=false;change(mode,false)}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();window.parent.postMessage({type:'cpsy-exit-interactive'},'*')}});document.addEventListener('visibilitychange',()=>{if(document.hidden)change(mode,false)});change('pixels',false);
</script></body></html>
