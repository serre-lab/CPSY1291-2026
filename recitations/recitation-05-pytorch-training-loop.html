</style></head><body><div class="marpit"><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="1" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="1" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17"><div class="eyebrow">Recitation 5 · Week 5</div>
<h1 id="pytorch">PyTorch</h1>
<h2 id="tensors-autograd-and-the-five-lines-that-train-everything">Tensors, autograd, and the five lines that train everything</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="2" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="2" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17">
<h1 id="the-one-idea">The one idea</h1>
<p><mark>PyTorch is NumPy that remembers what you did to it.</mark></p>
<p>Every operation on a tensor is <strong>recorded</strong>. When you finally produce one<br />
number — the loss — the library replays the recording backwards and hands you<br />
the derivative with respect to every parameter that took part.</p>
<p>That replay is <code>loss.backward()</code>. It is the only thing PyTorch does that NumPy cannot.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="3" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="3" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17">
<h1 id="tensors-are-arrays-with-two-gotchas">Tensors are arrays, with two gotchas</h1>
<pre><code class="language-python">x = torch.tensor(X_np, dtype=torch.float32)   <span class="hljs-comment"># note the cast</span>
x.numpy()                                     <span class="hljs-comment"># and back</span>
x.mean(dim=<span class="hljs-number">0</span>)                                 <span class="hljs-comment"># &#x27;axis&#x27; is spelled &#x27;dim&#x27;</span>
</code></pre>
<p><strong>NumPy defaults to <code>float64</code>. PyTorch wants <code>float32</code>.</strong></p>
<p><mark><code>RuntimeError: expected scalar type Float but found Double</code> = an uncast NumPy array. Never a bug in your model.</mark></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="4" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="4" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17">
<h1 id="batch-first-always">Batch first, always</h1>
<pre><code class="language-python">x.shape          <span class="hljs-comment"># (784,)     one image — layers reject this</span>
x[<span class="hljs-literal">None</span>].shape    <span class="hljs-comment"># (1, 784)   a batch of one</span>
</code></pre>
<table>
<thead>
<tr>
<th>data</th>
<th>shape</th>
</tr>
</thead>
<tbody>
<tr>
<td>tabular</td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>N</mi><mo separator="true">,</mo><mi>D</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(N, D)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">D</span><span class="mclose">)</span></span></span></span></td>
</tr>
<tr>
<td>images</td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>N</mi><mo separator="true">,</mo><mi>C</mi><mo separator="true">,</mo><mi>H</mi><mo separator="true">,</mo><mi>W</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(N, C, H, W)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0813em;">H</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">W</span><span class="mclose">)</span></span></span></span></td>
</tr>
<tr>
<td>sequences</td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>N</mi><mo separator="true">,</mo><mi>T</mi><mo separator="true">,</mo><mi>D</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(N, T, D)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">D</span><span class="mclose">)</span></span></span></span></td>
</tr>
</tbody>
</table>
<p><mark>Images are channels-<em>first</em> in PyTorch and channels-<em>last</em> in matplotlib: <code>img.permute(1, 2, 0)</code> before <code>imshow</code>.</mark></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="5" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="5" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17">
<h1 id="autograd-in-three-lines">Autograd, in three lines</h1>
<pre><code class="language-python">w = torch.tensor([<span class="hljs-number">2.0</span>], requires_grad=<span class="hljs-literal">True</span>)
loss = (w ** <span class="hljs-number">2</span>).<span class="hljs-built_in">sum</span>()      <span class="hljs-comment"># a graph is being recorded</span>
loss.backward()            <span class="hljs-comment"># replay it backwards</span>
w.grad                     <span class="hljs-comment"># tensor([4.])   — d(w^2)/dw = 2w</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="6" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="6" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17">
<h1 id="three-facts-that-explain-all-autograd-confusion">Three facts that explain all autograd confusion</h1>
<ol>
<li><strong>Gradients accumulate</strong> — <code>.grad</code> is <em>added</em> to, not replaced. Hence <code>opt.zero_grad()</code> every step.</li>
<li><strong><code>backward()</code> needs a scalar</strong> — if it complains, you forgot a <code>.mean()</code> or <code>.sum()</code>.</li>
<li><strong>The graph is freed after backward</strong> — calling it twice means you built the loss outside the loop.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="7" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="7" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17">
<h1 id="torchno_grad"><code>torch.no_grad()</code></h1>
<pre><code class="language-python">model.<span class="hljs-built_in">eval</span>()
<span class="hljs-keyword">with</span> torch.no_grad():
    acc = (model(Xte).argmax(<span class="hljs-number">1</span>) == yte).<span class="hljs-built_in">float</span>().mean()
</code></pre>
<p>Nothing is recorded inside the block: <strong>faster, and far less memory</strong>.</p>
<p>Use it whenever you are evaluating rather than training — validation accuracy,<br />
feature extraction, plotting.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="8" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="8" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17">
<h1 id="nnlinear-is-the-layer-from-lecture"><code>nn.Linear</code> is the layer from lecture</h1>
<p><code>nn.Linear(in, out)</code> computes <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold-italic">x</mi><msup><mi mathvariant="bold-italic">W</mi><mrow><mtext> ⁣</mtext><mi mathvariant="normal">⊤</mi></mrow></msup><mo>+</mo><mi mathvariant="bold-italic">b</mi></mrow><annotation encoding="application/x-tex">\boldsymbol{x}\boldsymbol{W}^{\!\top} + \boldsymbol{b}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0084em;vertical-align:-0.0833em;"></span><span class="mord"><span class="mord"><span class="mord boldsymbol">x</span></span></span><span class="mord"><span class="mord"><span class="mord"><span class="mord boldsymbol" style="margin-right:0.1597em;">W</span></span></span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.9251em;"><span style="top:-3.139em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mspace mtight" style="margin-right:-0.1952em;"></span><span class="mord mtight">⊤</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord"><span class="mord"><span class="mord boldsymbol">b</span></span></span></span></span></span> — a whole layer of last week's units.</p>
<pre><code class="language-python">model = nn.Sequential(
    nn.Linear(<span class="hljs-number">64</span>, <span class="hljs-number">16</span>),
    nn.ReLU(),               <span class="hljs-comment"># between the linear layers, not after the last</span>
    nn.Linear(<span class="hljs-number">16</span>, <span class="hljs-number">10</span>),
)
<span class="hljs-built_in">sum</span>(p.numel() <span class="hljs-keyword">for</span> p <span class="hljs-keyword">in</span> model.parameters())
</code></pre>
<p><mark><code>.weight</code> has shape <code>(out, in)</code> — the transpose of what you expect.</mark></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="9" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="9" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17">
<h1 id="the-trap-never-touch-your-logits">The trap: never touch your logits</h1>
<p>The last layer emits <strong>logits</strong> — raw, unbounded scores. Not probabilities.</p>
<p><code>nn.CrossEntropyLoss</code> applies <code>log_softmax</code> <strong>internally</strong>.</p>
<ul>
<li>softmax before it → applied twice → trains badly, silently</li>
<li><strong>ReLU</strong> before it → every negative logit clamped to 0 → the model can no longer say <em>&quot;this class is unlikely&quot;</em></li>
</ul>
<p><mark>Both are silent. Both are common in code you will find online.</mark></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="10" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="10" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17">
<h1 id="the-training-loop-complete">The training loop, complete</h1>
<pre><code class="language-python"><span class="hljs-keyword">for</span> epoch <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">200</span>):
    opt.zero_grad()             <span class="hljs-comment"># 1. forget last step&#x27;s gradients</span>
    out  = model(Xtr)           <span class="hljs-comment"># 2. forward</span>
    loss = lossfn(out, ytr)     <span class="hljs-comment"># 3. how wrong are we?</span>
    loss.backward()             <span class="hljs-comment"># 4. gradients w.r.t. every parameter</span>
    opt.step()                  <span class="hljs-comment"># 5. one step downhill</span>
</code></pre>
<p><mark>Steps 1–4 only <em>compute</em>. Nothing moves until <code>opt.step()</code>.</mark></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="11" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="11" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17">
<h1 id="exercise-1">EXERCISE 1</h1>
<p>Your loss falls for 5 epochs, then grows without bound and reaches <code>nan</code>.</p>
<p>Name the <strong>two</strong> most likely causes, and how you would tell them apart.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="12" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="12" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17">
<h1 id="sgd-or-adam">SGD or Adam?</h1>
<table>
<thead>
<tr>
<th></th>
<th><code>SGD</code></th>
<th><code>Adam</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>is</td>
<td>the rule you derived last week</td>
<td>a per-parameter adaptive step</td>
</tr>
<tr>
<td>typical <code>lr</code></td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>10</mn><mrow><mo>−</mo><mn>2</mn></mrow></msup></mrow><annotation encoding="application/x-tex">10^{-2}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span></span>–<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>10</mn><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow><annotation encoding="application/x-tex">10^{-1}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mtight">1</span></span></span></span></span></span></span></span></span></span></span></span></td>

<p><mark>The learning rates are not interchangeable — Adam's <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>10</mn><mrow><mo>−</mo><mn>3</mn></mrow></msup></mrow><annotation encoding="application/x-tex">10^{-3}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mtight">3</span></span></span></span></span></span></span></span></span></span></span></span> given to SGD trains imperceptibly.</mark></p>

<h1 id="reading-a-pretrained-network">Reading a pretrained network</h1>
<pre><code class="language-python">net = torchvision.models.alexnet(weights=<span class="hljs-string">&#x27;DEFAULT&#x27;</span>)
net.<span class="hljs-built_in">eval</span>()
W = net.features[<span class="hljs-number">0</span>].weight.detach().numpy()   <span class="hljs-comment"># (64, 3, 11, 11)</span>
</code></pre>
<p><code>.detach()</code> takes the tensor out of the autograd graph so it can become NumPy.</p>
<p><mark>Pretrained models expect their inputs normalized the way they were trained. Skip it and the numbers are not comparable to anything published.</mark></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="14" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="14" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17">
<h1 id="when-it-does-not-learn--in-this-order">When it does not learn — in this order</h1>
<ol>
<li>Is the loss going down <strong>at all</strong>? Print it. Log axis.</li>
<li>Did you call <code>opt.zero_grad()</code>?</li>
<li><strong>Learning rate</strong> — try ×10 and ÷10 before anything else.</li>
<li>Targets the right dtype and shape? (<code>long</code>, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>N</mi><mo separator="true">,</mo><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(N,)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mclose">)</span></span></span></span>, class indices)</li>
<li>Is there a nonlinearity <strong>between</strong> the linear layers?</li>
<li>Did you apply softmax or ReLU to the logits?</li>
<li><strong>Can it overfit 10 examples?</strong></li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="15" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="15" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17">
<h1 id="the-thirty-second-test">The thirty-second test</h1>
<p><mark>Train on ten examples and try to drive the loss to zero.</mark></p>
<ul>
<li><strong>It cannot</strong> → the bug is in the model, the loss, or the wiring.</li>
<li><strong>It can</strong> → the model works; your problem is the data, or the amount of training.</li>
</ul>
<p>A model that cannot memorize ten points will never generalize from ten thousand.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="16" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="16" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17">
<h1 id="exercise-2">EXERCISE 2</h1>
<p><code>nn.Sequential(nn.Linear(64,16), nn.Linear(16,10))</code></p>
<ol>
<li>How many parameters?</li>
<li>What function class can it express?</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1920 1080"><foreignObject width="1920" height="1080"><section id="17" data-paginate="true" data-theme="cpsy1291" data-marpit-pagination="17" style="--paginate:true;--theme:cpsy1291;" data-marpit-pagination-total="17">
<h1 id="where-this-lands-in-assignment-2">Where this lands in Assignment 2</h1>
<ul>
<li><strong>Part 1</strong> — reading AlexNet's first layer, normalizing inputs, <code>no_grad</code></li>
<li><strong>Part 4</strong> — the provided <code>train_xor</code> loop: you read it, you do not write it</li>
<li><strong>Everywhere</strong> — <code>manual_seed</code>, and the fact that one run is one observation</li>
</ul>
<p>Next week: <strong>overfitting</strong> — the model that trains perfectly and still fails.</p>
