<text x="232" y="97" text-anchor="middle" font-size="22" font-weight="400" fill="#1E293B">black</text>
<path d="M281,90 H314" fill="none" stroke="#B5862A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold)"/>
<rect x="317" y="66" width="94" height="48" rx="8" fill="#FBE9B7" stroke="#C9962B" stroke-width="3"/>
<text x="364" y="97" text-anchor="middle" font-size="22" font-weight="600" fill="#1E293B">cat</text>
