<text x="364" y="313" text-anchor="middle" font-size="22" font-weight="600" fill="#1E293B">cat</text>
<rect x="449" y="283" width="94" height="46" rx="8" fill="white" stroke="#8A7E70" stroke-width="2.2"/>
<text x="496" y="313" text-anchor="middle" font-size="22" font-weight="400" fill="#1E293B">sat</text>
<rect x="581" y="283" width="94" height="46" rx="8" fill="white" stroke="#8A7E70" stroke-width="2.2"/>
<text x="628" y="313" text-anchor="middle" font-size="22" font-weight="400" fill="#1E293B">on</text>
<rect x="713" y="283" width="94" height="46" rx="8" fill="white" stroke="#8A7E70" stroke-width="2.2"/>
<text x="760" y="313" text-anchor="middle" font-size="22" font-weight="400" fill="#1E293B">the</text>
<rect x="845" y="283" width="94" height="46" rx="8" fill="white" stroke="#8A7E70" stroke-width="2.2"/>
<text x="892" y="313" text-anchor="middle" font-size="22" font-weight="400" fill="#1E293B">mat</text>
<rect x="977" y="283" width="94" height="46" rx="8" fill="white" stroke="#8A7E70" stroke-width="2.2"/>
<text x="1024" y="313" text-anchor="middle" font-size="22" font-weight="400" fill="#1E293B">.</text>
<rect x="1109" y="283" width="94" height="46" rx="8" fill="white" stroke="#8A7E70" stroke-width="2.2"/>
<text x="1156" y="313" text-anchor="middle" font-size="22" font-weight="400" fill="#1E293B">The</text>
<rect x="1241" y="283" width="94" height="46" rx="8" fill="white" stroke="#B5396B" stroke-width="3"/>
<text x="1288" y="313" text-anchor="middle" font-size="22" font-weight="600" fill="#1E293B">black</text>
<path d="M364,330 V344" fill="none" stroke="#3E6D8E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="244" y="344" width="240" height="161" rx="12" fill="none" stroke="#B7BEC7" stroke-width="1.5"/>
<rect x="254" y="354" width="220" height="65" rx="8" fill="#DCE6EE" stroke="#3E6D8E" stroke-width="2.2"/>
