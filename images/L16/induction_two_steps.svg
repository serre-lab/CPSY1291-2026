<text x="1288" y="148" text-anchor="middle" font-size="20" font-weight="400" fill="#1E293B">current position</text>
<path d="M24,196 H1576" fill="none" stroke="#B7BEC7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="228" text-anchor="start" font-size="22" font-weight="600" fill="#1E293B">Block 2: induction head</text>
<text x="820" y="228" text-anchor="middle" font-size="20" font-weight="400" fill="#1E293B">one head alone: finds black, reads back black</text>
<path d="M1288,281 C1288,235 232,235 232,281" fill="none" stroke="#B7BEC7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#grey)" stroke-dasharray="7 7"/>
