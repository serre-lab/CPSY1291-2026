<rect x="449" y="66" width="94" height="48" rx="8" fill="white" stroke="#8A7E70" stroke-width="2.2"/>
<text x="496" y="97" text-anchor="middle" font-size="22" font-weight="400" fill="#1E293B">sat</text>
