<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" font-family="Poppins, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Two steps of an induction circuit</title>
<desc id="desc">A previous-token head tags cat with previous: black; the final black queries that key, reads the cat value, and predicts cat. An identity-only lookup instead finds the earlier black and reads black.</desc>
<defs>
<marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B5862A"/></marker>
<marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B7BEC7"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3F7A6B"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3E6D8E"/></marker>
</defs>
<text x="24" y="32" text-anchor="start" font-size="22" font-weight="600" fill="#1E293B">Block 1: previous-token head</text>
<text x="1558" y="32" text-anchor="end" font-size="20" font-weight="400" fill="#1E293B">each position reads the one before</text>
