<text x="1288" y="97" text-anchor="middle" font-size="22" font-weight="600" fill="#1E293B">black</text>
<path d="M364,114 V133" fill="none" stroke="#3E6D8E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="256" y="137" width="216" height="38" rx="8" fill="#DCE6EE" stroke="#3E6D8E" stroke-width="2.2"/>
