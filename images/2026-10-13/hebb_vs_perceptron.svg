<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1E293B"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#FAF9F5"/>
  <line x1="500.0" y1="50" x2="500.0" y2="350" stroke="#E7E3DA" stroke-width="2"/>
  <text x="235" y="72" font-size="23" fill="#334155" text-anchor="middle" font-weight="700" dominant-baseline="middle">Hebb — no teacher</text>
  <circle cx="70" cy="180" r="25" fill="white" stroke="#3E6D8E" stroke-width="2.8"/>
  <text x="70" y="180" font-size="23" fill="#3E6D8E" text-anchor="middle" font-weight="700" font-style="italic" dominant-baseline="middle">x</text>
  <line x1="95" y1="180" x2="216" y2="180" stroke="#A89B8C" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="160.0" y="164" font-size="23" fill="#B5396B" text-anchor="middle" font-weight="700" font-style="italic" dominant-baseline="middle">w</text>
  <circle cx="250" cy="180" r="34" fill="white" stroke="#1E293B" stroke-width="3"/>
  <text x="250" y="180" font-size="32" fill="#1E293B" text-anchor="middle" font-weight="700" dominant-baseline="middle">Σ</text>
  <line x1="284" y1="180" x2="370" y2="180" stroke="#1E293B" stroke-width="2.6" marker-end="url(#arrow)"/>
  <text x="392" y="180" font-size="24" fill="#3F7A6B" text-anchor="middle" font-weight="700" font-style="italic" dominant-baseline="middle">a</text>
  <text x="250" y="305" font-size="30" fill="#334155" text-anchor="middle" font-weight="700" font-style="italic" dominant-baseline="middle">Δw = η · x · a</text>
  <text x="250" y="348" font-size="19" fill="#A89B8C" text-anchor="middle" font-weight="500" dominant-baseline="middle">co-occurrence — no error term</text>
  <text x="745" y="72" font-size="23" fill="#B23A2E" text-anchor="middle" font-weight="700" dominant-baseline="middle">Perceptron — with a teacher</text>
  <circle cx="580" cy="180" r="25" fill="white" stroke="#3E6D8E" stroke-width="2.8"/>
  <text x="580" y="180" font-size="23" fill="#3E6D8E" text-anchor="middle" font-weight="700" font-style="italic" dominant-baseline="middle">x</text>
  <line x1="605" y1="180" x2="726" y2="180" stroke="#A89B8C" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="670.0" y="164" font-size="23" fill="#B5396B" text-anchor="middle" font-weight="700" font-style="italic" dominant-baseline="middle">w</text>
  <circle cx="760" cy="180" r="34" fill="white" stroke="#1E293B" stroke-width="3"/>
  <text x="760" y="180" font-size="32" fill="#1E293B" text-anchor="middle" font-weight="700" dominant-baseline="middle">Σ</text>
  <line x1="794" y1="180" x2="875" y2="142" stroke="#1E293B" stroke-width="2.6" marker-end="url(#arrow)"/>
  <text x="898" y="134" font-size="24" fill="#3F7A6B" text-anchor="middle" font-weight="700" font-style="italic" dominant-baseline="middle">ŷ</text>
  <circle cx="878" cy="238" r="23" fill="#FFF7E0" stroke="#FFC72C" stroke-width="2.8"/>
  <text x="878" y="238" font-size="22" fill="#B5396B" text-anchor="middle" font-weight="700" font-style="italic" dominant-baseline="middle">y</text>
  <text x="914" y="238" font-size="17" fill="#A89B8C" text-anchor="start" font-weight="500" dominant-baseline="middle">teacher</text>
  <text x="820" y="194" font-size="21" fill="#B23A2E" text-anchor="start" font-weight="700" font-style="italic" dominant-baseline="middle">δ = y − ŷ</text>
  <text x="760" y="305" font-size="30" fill="#334155" text-anchor="middle" font-weight="700" font-style="italic" dominant-baseline="middle">Δw = η · δ · x</text>
  <text x="760" y="348" font-size="19" fill="#B23A2E" text-anchor="middle" font-weight="500" dominant-baseline="middle">error-gated learning</text>
  <text x="500.0" y="398" font-size="21" fill="#1E293B" text-anchor="middle" font-weight="600" dominant-baseline="middle">the perceptron is Hebb gated by the prediction error  δ</text>

</svg>
