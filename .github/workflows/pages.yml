name: build-and-publish
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assemble site
        run: |
          mkdir -p _site/recitations
          for f in recitations/recitation-*.md; do
            b=$(basename "$f" .md)
            npx --yes @marp-team/marp-cli@latest "$f" -o "_site/recitations/$b.html" --html
          done
          cp -f recitations/handout-*.pdf recitations/bootcamp-notes.pdf _site/recitations/ 2>/dev/null || true
          cp -f colab-setup.html _site/ 2>/dev/null || true
          for d in slides images demos figures; do
            [ -d "$d" ] && cp -R "$d" "_site/$d" || true
          done
          {
            echo '<!doctype html><meta charset="utf-8"><title>CPSY 1291 — Fall 2026</title><h1>CPSY 1291 — Fall 2026</h1>'
            echo '<h2>Lectures</h2><ul>'
            for f in _site/slides/*.html; do [ -f "$f" ] || continue; b=$(basename "$f"); echo "<li><a href=\"slides/$b\">${b%.html}</a></li>"; done
            echo '</ul><h2>Recitations</h2><ul>'
            for f in _site/recitations/recitation-*.html; do b=$(basename "$f"); echo "<li><a href=\"recitations/$b\">${b%.html}</a></li>"; done
            for f in _site/recitations/*.pdf; do [ -f "$f" ] || continue; b=$(basename "$f"); echo "<li><a href=\"recitations/$b\">$b</a></li>"; done
            echo '</ul><p><a href="colab-setup.html">Colab setup</a></p>'
          } > _site/index.html
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
